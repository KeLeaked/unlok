<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Título discreto -->
    <title>Portal de Acesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-red: #ff3b3b;
            --text-main: #f0f0f0;
            --text-muted: #888888;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #2a0808 0%, #0a0a0a 60%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
            align-items: center;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            position: relative;
        }
        
        .container { 
            display: none; width: 100%; max-width: 420px; 
            height: 100%; padding: 20px; box-sizing: border-box; 
            flex-direction: column; z-index: 10;
        }

        /* --- TELA DE LOGIN DISCRETA --- */
        #login-screen { display: flex; justify-content: center; align-items: center; }
        .login-box {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 40px 30px; text-align: center; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .icon-lock { font-size: 40px; color: var(--text-muted); margin-bottom: 20px; }
        input.senha {
            padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border);
            font-size: 16px; text-align: center; background: rgba(0,0,0,0.3); color: white;
            width: 100%; box-sizing: border-box; margin-bottom: 20px; letter-spacing: 5px;
            outline: none; transition: 0.3s;
        }
        input.senha:focus { border-color: var(--primary-red); }
        button.btn-entrar {
            padding: 15px; border-radius: 12px; border: none;
            background: var(--primary-red); color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.2s; width: 100%; letter-spacing: 1px;
        }
        button.btn-entrar:active { transform: scale(0.97); }

        /* --- TELA DO APP --- */
        .header-area { 
            text-align: center; padding: 10px 0; flex-shrink: 0;
            background: var(--glass-bg); border-radius: 20px; border: 1px solid var(--glass-border);
            backdrop-filter: blur(5px); margin-bottom: 15px;
        }
        
        .heart-wrapper { height: 130px; display: flex; align-items: center; justify-content: center; margin: 5px 0; }
        .heart {
            font-size: 85px; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none; -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.1)); line-height: 1;
        }
        .heart.beating { animation: pulse 1s infinite alternate; filter: drop-shadow(0 0 35px rgba(255, 59, 59, 0.6)); }
        .heart.glowing { animation: glow 1.5s infinite alternate; }

        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.15); } }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.4)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 50px rgba(255, 105, 180, 0.9)); transform: scale(1.1); }
        }

        .status-text { font-size: 14px; min-height: 40px; color: #ffb3b3; line-height: 1.4; padding: 0 15px; }
        .time-badge { font-size: 11px; color: var(--text-muted); display: block; margin-top: 4px; }

        /* --- BARRA DE EMOJIS --- */
        .emoji-bar {
            display: flex; justify-content: space-evenly; align-items: center;
            padding: 12px; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; flex-shrink: 0; margin-bottom: 15px; backdrop-filter: blur(5px);
        }
        .emoji-btn {
            background: none; border: none; font-size: 24px; padding: 5px;
            cursor: pointer; transition: 0.2s; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .emoji-btn:active { transform: scale(0.6); }

        /* --- MINI CHAT PROFISSIONAL --- */
        .chat-container {
            flex: 1; display: flex; flex-direction: column;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; overflow: hidden; backdrop-filter: blur(5px);
            min-height: 0; 
        }
        .messages {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .msg-wrapper.mine { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.theirs { align-self: flex-start; align-items: flex-start; }

        .msg {
            padding: 10px 14px; border-radius: 18px; font-size: 14px; word-wrap: break-word; line-height: 1.4;
        }
        .msg.mine { background: linear-gradient(135deg, #ff3b3b, #cc0000); color: white; border-bottom-right-radius: 4px; }
        .msg.theirs { background: rgba(255,255,255,0.1); color: #fff; border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        
        /* MINIATURAS QUADRADAS DE IMAGEM NO CHAT */
        .msg img {
            width: 120px; height: 120px; /* Tamanho pequeno e fixo */
            object-fit: cover; /* Deixa a imagem quadrada sem amassar */
            border-radius: 12px; margin-top: 2px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }
        .msg img:active { opacity: 0.7; }

        .msg-time { font-size: 10px; color: #aaa; margin-top: 3px; padding: 0 4px; }

        .chat-input-area { 
            display: flex; background: rgba(0,0,0,0.4); padding: 10px; gap: 8px;
            border-top: 1px solid var(--glass-border); align-items: center;
        }
        .chat-input-area input[type="text"] {
            flex: 1; padding: 12px 15px; border-radius: 25px; background: rgba(255,255,255,0.05);
            color: white; border: 1px solid var(--glass-border); font-size: 15px; outline: none;
            transition: 0.3s;
        }
        .chat-input-area input[type="text"]:focus { background: rgba(255,255,255,0.1); border-color: #555; }
        
        .btn-action {
            border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            transition: 0.2s;
        }
        .btn-attach { background: rgba(255,255,255,0.1); color: #ccc; }
        .btn-attach:active { background: rgba(255,255,255,0.3); }
        .btn-send { background: var(--primary-red); color: white; box-shadow: 0 4px 10px rgba(255, 59, 59, 0.3); }
        .btn-send:active { transform: scale(0.9); }

        /* Emoji Flutuante */
        .floating-emoji {
            position: fixed; bottom: 80px; font-size: 35px; pointer-events: none; z-index: 50;
            animation: floatUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards; text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.5); }
            20% { opacity: 1; transform: translateY(0) scale(1.2); }
            100% { opacity: 0; transform: translateY(-350px) scale(1); }
        }

        /* Visualizador de Imagem em Tela Cheia */
        #image-viewer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center;
        }
        #image-viewer img { max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .fechar-img { position: absolute; top: 20px; right: 25px; color: white; font-size: 40px; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

    <!-- Visualizador de Imagem -->
    <div id="image-viewer">
        <span class="fechar-img" onclick="fecharImagem()">×</span>
        <img id="fullscreen-img" src="">
    </div>

    <!-- TELA 1: LOGIN DISCRETO -->
    <div id="login-screen" class="container">
        <div class="login-box">
            <div class="icon-lock">🔒</div>
            <h3 style="margin-top:0; font-weight: 400; color: #ccc;">Acesso Restrito</h3>
            <input type="password" id="senha" class="senha" placeholder="••••" inputmode="numeric">
            <button class="btn-entrar" onclick="verificarSenha()">Autenticar</button>
        </div>
    </div>

    <!-- TELA 2: APP PRINCIPAL -->
    <div id="app-screen" class="container">
        
        <div class="header-area">
            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;" id="greeting">Conexão Segura</div>
            
            <div class="heart-wrapper">
                <div id="heart-btn" class="heart">🤍</div>
            </div>
            
            <div id="status" class="status-text">Estabelecendo conexão sincrônica...</div>
        </div>
        
        <!-- Emojis Originais -->
        <div class="emoji-bar">
            <button class="emoji-btn" onclick="enviarEmoji('🥺')">🥺</button>
            <button class="emoji-btn" onclick="enviarEmoji('😍')">😍</button>
            <button class="emoji-btn" onclick="enviarEmoji('😘')">😘</button>
            <button class="emoji-btn" onclick="enviarEmoji('💞')">💞</button>
            <button class="emoji-btn" onclick="enviarEmoji('💘')">💘</button>
            <button class="emoji-btn" onclick="enviarEmoji('💖')">💖</button>
        </div>

        <div class="chat-container">
            <div id="messages-area" class="messages">
                <!-- Mensagens dinâmicas -->
            </div>
            <div class="chat-input-area">
                <!-- Botão de Anexo (Câmera/Galeria) -->
                <button class="btn-action btn-attach" onclick="document.getElementById('file-input').click()">📷</button>
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="processarImagem(event)">
                
                <input type="text" id="chat-input" placeholder="Mensagem..." onkeypress="verificarEnter(event)">
                <button class="btn-action btn-send" onclick="enviarMensagem()">➤</button>
            </div>
        </div>

    </div>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD15BizvlLZEvZPi4VJDOJ-aI7t1lcNQi4",
            authDomain: "nosso-coracao.firebaseapp.com",
            databaseURL: "https://nosso-coracao-default-rtdb.firebaseio.com",
            projectId: "nosso-coracao",
            storageBucket: "nosso-coracao.firebasestorage.app",
            messagingSenderId: "560106544356",
            appId: "1:560106544356:web:25926da1705d98941da0f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let usuarioAtual = "";
        let parceiro = "";
        let nomeExibicaoParceiro = "";
        
        let meuEstado = { state: "idle", time: 0 };
        let estadoParceiro = { state: "idle", time: 0 };

        let tapTimeout = null;
        let lastTap = 0;
        let ultimaVerificacaoEmoji = Date.now(); 

        const dbRefs = {};
        const emojiRefs = {};
        const chatRef = ref(db, 'chat');

        function formatarHora(timestamp) {
            if (!timestamp) return "";
            const data = new Date(timestamp);
            return data.getHours().toString().padStart(2, '0') + ':' + data.getMinutes().toString().padStart(2, '0');
        }

        // Funções para ver fotos em tela cheia
        window.abrirImagem = function(src) {
            document.getElementById('fullscreen-img').src = src;
            document.getElementById('image-viewer').style.display = 'flex';
        }
        window.fecharImagem = function() {
            document.getElementById('image-viewer').style.display = 'none';
            document.getElementById('fullscreen-img').src = '';
        }

        window.verificarSenha = function() {
            const senhaDigitada = document.getElementById('senha').value;

            if (senhaDigitada === '1509') {
                usuarioAtual = 'kevin'; parceiro = 'ana';
                nomeExibicaoParceiro = 'Ana';
                prepararTela('Kevin');
            } else if (senhaDigitada === '1507') {
                usuarioAtual = 'ana'; parceiro = 'kevin';
                nomeExibicaoParceiro = 'Kevin';
                prepararTela('Ana');
            } else {
                document.getElementById('senha').style.borderColor = 'red';
                document.getElementById('senha').value = '';
                setTimeout(() => document.getElementById('senha').style.borderColor = 'var(--glass-border)', 1000);
            }
        }

        function prepararTela(nomeExibicao) {
            dbRefs.kevin = ref(db, 'status_v2/kevin');
            dbRefs.ana = ref(db, 'status_v2/ana');
            emojiRefs.kevin = ref(db, 'emoji/kevin');
            emojiRefs.ana = ref(db, 'emoji/ana');

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            
            document.getElementById('greeting').innerText = `Conectado: ${nomeExibicao}`;
            
            set(dbRefs[usuarioAtual], { state: 'idle', time: Date.now() });
            ultimaVerificacaoEmoji = Date.now(); 
            iniciarMonitoramento();
        }

        function atualizarTela() {
            const heartBtn = document.getElementById('heart-btn');
            const statusText = document.getElementById('status');
            heartBtn.classList.remove('beating', 'glowing');

            const sMeu = typeof meuEstado === 'string' ? meuEstado : (meuEstado?.state || 'idle');
            const sParceiro = typeof estadoParceiro === 'string' ? estadoParceiro : (estadoParceiro?.state || 'idle');
            const horaParceiro = estadoParceiro?.time ? formatarHora(estadoParceiro.time) : '';
            const horaMinha = meuEstado?.time ? formatarHora(meuEstado.time) : formatarHora(Date.now());

            if (sMeu === 'visto') {
                statusText.innerHTML = `<b style="color: #fff;">${nomeExibicaoParceiro} sentiu seu coração ❤️</b><span class="time-badge">Conexão estabelecida às ${horaMinha}</span>`;
                heartBtn.innerText = "❤️‍🔥";
                heartBtn.classList.add('glowing');
                setTimeout(() => {
                    if((typeof meuEstado === 'string' ? meuEstado : meuEstado.state) === 'visto') {
                        set(dbRefs[usuarioAtual], { state: 'idle', time: Date.now() });
                    }
                }, 5000);
                return; 
            }

            if (sParceiro === 'pensando') {
                statusText.innerHTML = `<b style="color: white;">${nomeExibicaoParceiro} está pensando em você!</b><span class="time-badge">Enviado às ${horaParceiro} • Toque 2x para avisar que sentiu</span>`;
                heartBtn.innerText = "❤️";
                heartBtn.classList.add('beating');
                return;
            }

            if (sMeu === 'pensando') {
                statusText.innerHTML = `<span style="color:#aaa;">Pensamento enviado para ${nomeExibicaoParceiro}...</span><span class="time-badge">Enviado às ${horaMinha} • Aguardando resposta</span>`;
                heartBtn.innerText = "❤️";
                return;
            }

            statusText.innerHTML = `<span style="color:#666;">Frequência estabilizada.</span><span class="time-badge">Toque 1x p/ enviar saudade • 2x p/ receber</span>`;
            heartBtn.innerText = "🤍"; 
        }

        window.enviarEmoji = function(emoji) {
            set(emojiRefs[usuarioAtual], { icon: emoji, time: Date.now() });
            criarAnimacaoEmoji(emoji);
        }

        function criarAnimacaoEmoji(emoji) {
            const el = document.createElement('div');
            el.innerText = emoji;
            el.className = 'floating-emoji';
            const randomLeft = 20 + Math.random() * 60; 
            el.style.left = `${randomLeft}%`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // Processar e comprimir imagem antes de enviar
        window.processarImagem = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; 
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64Img = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    push(chatRef, {
                        sender: usuarioAtual,
                        tipo: 'imagem',
                        conteudo: base64Img,
                        timestamp: Date.now()
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        window.enviarMensagem = function() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            if (texto !== "") {
                push(chatRef, { 
                    sender: usuarioAtual, 
                    tipo: 'texto', 
                    conteudo: texto, 
                    timestamp: Date.now() 
                });
                input.value = ""; 
            }
        }

        window.verificarEnter = function(event) {
            if (event.key === "Enter") enviarMensagem();
        }

        function iniciarMonitoramento() {
            const heartBtn = document.getElementById('heart-btn');

            onValue(dbRefs[usuarioAtual], (snapshot) => {
                meuEstado = snapshot.val() || { state: 'idle', time: Date.now() };
                atualizarTela();
            });
            onValue(dbRefs[parceiro], (snapshot) => {
                estadoParceiro = snapshot.val() || { state: 'idle', time: Date.now() };
                atualizarTela();
            });
            onValue(emojiRefs[parceiro], (snapshot) => {
                const data = snapshot.val();
                if (data && data.time > ultimaVerificacaoEmoji) {
                    ultimaVerificacaoEmoji = data.time;
                    criarAnimacaoEmoji(data.icon);
                }
            });

            onValue(chatRef, (snapshot) => {
                const messagesArea = document.getElementById('messages-area');
                messagesArea.innerHTML = ""; 
                
                snapshot.forEach((childSnapshot) => {
                    const msg = childSnapshot.val();
                    const tipoMsg = msg.tipo || 'texto'; 
                    const conteudoMsg = msg.conteudo || msg.texto; 

                    const isMine = msg.sender === usuarioAtual;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'msg-wrapper ' + (isMine ? 'mine' : 'theirs');
                    
                    const msgBubble = document.createElement('div');
                    msgBubble.className = 'msg ' + (isMine ? 'mine' : 'theirs');
                    
                    if (tipoMsg === 'imagem') {
                        msgBubble.style.background = 'transparent';
                        msgBubble.style.padding = '0';
                        msgBubble.style.border = 'none';
                        msgBubble.innerHTML = `<img src="${conteudoMsg}" onclick="abrirImagem(this.src)">`;
                    } else {
                        msgBubble.innerText = conteudoMsg;
                    }
                    
                    const timeLabel = document.createElement('div');
                    timeLabel.className = 'msg-time';
                    timeLabel.innerText = formatarHora(msg.timestamp);

                    wrapper.appendChild(msgBubble);
                    wrapper.appendChild(timeLabel);
                    messagesArea.appendChild(wrapper);
                });
                
                setTimeout(() => messagesArea.scrollTop = messagesArea.scrollHeight, 50);
            });

            heartBtn.addEventListener('click', function(e) {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                const sParceiro = typeof estadoParceiro === 'string' ? estadoParceiro : estadoParceiro?.state;
                const sMeu = typeof meuEstado === 'string' ? meuEstado : meuEstado?.state;

                if (tapLength < 400 && tapLength > 0) {
                    clearTimeout(tapTimeout);
                    if (sParceiro === 'pensando') {
                        set(dbRefs[parceiro], { state: 'visto', time: Date.now() });
                        heartBtn.innerText = "✨";
                        setTimeout(() => atualizarTela(), 600);
                    }
                } else {
                    tapTimeout = setTimeout(function() {
                        if (sMeu !== 'pensando' && sMeu !== 'visto') {
                            set(dbRefs[usuarioAtual], { state: 'pensando', time: Date.now() });
                            heartBtn.style.transform = "scale(0.8)";
                            setTimeout(() => heartBtn.style.transform = "scale(1)", 150);
                        }
                    }, 400);
                }
                lastTap = currentTime;
            });
        }
    </script>
</body>
</html>
