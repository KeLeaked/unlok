<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Espaço</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-panel: #141418;
            --primary: #ff2a4b;
            --primary-dark: #cc1835;
            --text-main: #f0f0f0;
            --text-muted: #8a8a93;
            --glass-bg: rgba(20, 20, 24, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --secret-bg: #050505;
            --secret-primary: #9d00ff;
            --secret-dark: #6a00b3;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Proteção contra print (dissuasor - só funciona desktop) */
        .blur-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.97); z-index: 99999;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: 15px; color: white; font-size: 16px;
            text-align: center; padding: 20px;
        }
        .blur-overlay.show { display: flex; }
        .blur-overlay i { font-size: 48px; color: var(--primary); }

        /* LOGIN */
        #login-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; padding: 20px;
            background: radial-gradient(circle at 50% 0%, #2a0812 0%, var(--bg-dark) 60%);
        }
        .login-box {
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 40px 30px; text-align: center; width: 100%; max-width: 320px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .login-box i { font-size: 40px; color: var(--primary); margin-bottom: 20px; }
        .login-box h3 { margin: 0 0 8px 0; font-weight: 500; font-size: 18px; }
        .login-box p { margin: 0 0 20px 0; font-size: 13px; color: var(--text-muted); }
        input.senha {
            padding: 16px; border-radius: 14px; border: 1px solid var(--glass-border);
            font-size: 20px; text-align: center; background: rgba(0,0,0,0.5); color: white;
            width: 100%; box-sizing: border-box; margin-bottom: 20px; letter-spacing: 8px;
            outline: none; transition: 0.3s;
        }
        input.senha:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,42,75,0.2); }
        button.btn-entrar {
            padding: 16px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; width: 100%; transition: 0.2s;
        }
        button.btn-entrar:active { transform: scale(0.97); }

        /* APP */
        #app-screen { display: none; flex-direction: column; height: 100%; }

        .app-header {
            padding: 15px 20px; background: var(--glass-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 600; font-size: 16px; }
        .user-status { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .status-online { color: #00e676; font-weight: 500; }

        .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
        .view.active { display: flex; }

        /* SINTONIA */
        #view-sintonia { justify-content: center; align-items: center; padding: 20px; background: radial-gradient(circle at 50% 50%, #1f0a0d 0%, var(--bg-dark) 100%); }
        .heart-wrapper { display: flex; flex-direction: column; align-items: center; }
        .heart {
            font-size: 100px; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent; filter: drop-shadow(0 0 20px rgba(255, 42, 75, 0.2));
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        }
        .heart.beating { animation: pulse 1s infinite alternate; filter: drop-shadow(0 0 40px rgba(255, 42, 75, 0.6)); }
        .heart.connected { animation: fireGlow 1.2s infinite alternate; }
        .sintonia-text { margin-top: 30px; text-align: center; color: var(--text-muted); font-size: 14px; line-height: 1.5; }
        .sintonia-text strong { color: white; display: block; margin-bottom: 5px; font-size: 16px; }
        @keyframes pulse { 0% { transform: scale(0.9); } 100% { transform: scale(1.15); } }
        @keyframes fireGlow {
            0% { filter: drop-shadow(0 0 20px rgba(255, 100, 0, 0.5)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 60px rgba(255, 50, 0, 1)); transform: scale(1.15); }
        }

        /* CHAT */
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; position: relative; }
        .msg-wrapper.mine { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-box {
            padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4;
            cursor: pointer; position: relative;
        }
        .msg-wrapper.mine .msg-box { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg-wrapper.theirs .msg-box { background: var(--bg-panel); color: white; border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        .msg-reply-ref {
            background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px; font-size: 12px;
            margin-bottom: 6px; border-left: 3px solid rgba(255,255,255,0.5); display: block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
        }
        .msg-box img { width: 150px; height: 150px; object-fit: cover; border-radius: 12px; margin-top: 2px; border: 1px solid rgba(255,255,255,0.1); }
        .msg-time { font-size: 10px; color: #888; margin-top: 4px; padding: 0 4px; }

        .reply-indicator {
            display: none; background: var(--bg-panel); padding: 10px 15px; border-top: 1px solid var(--glass-border);
            justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted);
        }
        .reply-indicator span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 10px; color: white; }
        .reply-indicator i { cursor: pointer; padding: 5px; }

        .chat-input-area {
            display: flex; background: var(--bg-dark); padding: 10px 15px; gap: 10px;
            border-top: 1px solid var(--glass-border); align-items: center; padding-bottom: 20px;
        }
        .chat-input-area input[type="text"] {
            flex: 1; padding: 14px 18px; border-radius: 24px; background: var(--bg-panel);
            color: white; border: 1px solid var(--glass-border); font-size: 15px; outline: none;
        }
        .btn-action {
            border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s;
        }
        .btn-attach { background: transparent; color: var(--text-muted); }
        .btn-send { background: var(--primary); color: white; }

        /* MODO SECRETO */
        #view-secreto { background: var(--secret-bg); }
        #view-secreto .msg-wrapper.mine .msg-box { background: linear-gradient(135deg, var(--secret-primary), var(--secret-dark)); }
        #view-secreto .msg-wrapper.theirs .msg-box { background: #1a0a2a; border-color: rgba(157, 0, 255, 0.2); }
        .secreto-header {
            text-align: center; padding: 10px 14px; background: rgba(157, 0, 255, 0.1);
            color: var(--secret-primary); font-size: 12px; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(157, 0, 255, 0.15);
        }
        .secreto-header .info { display: flex; align-items: center; gap: 8px; }
        .btn-burn {
            background: transparent; border: 1px solid var(--secret-primary); color: var(--secret-primary);
            border-radius: 12px; padding: 6px 12px; font-size: 11px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .btn-burn:active { background: rgba(157, 0, 255, 0.2); transform: scale(0.95); }
        .btn-view-once { color: var(--secret-primary); }
        #view-secreto .btn-send { background: var(--secret-primary); }

        /* FOTO ÚNICA */
        .msg-once-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .msg-once-box {
            width: 220px; height: 220px; border-radius: 16px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px; cursor: pointer;
            background: linear-gradient(135deg, rgba(157,0,255,0.15), rgba(157,0,255,0.05));
            border: 2px dashed rgba(157, 0, 255, 0.4); transition: 0.3s;
        }
        .msg-once-box:active { transform: scale(0.96); }
        .msg-once-box i { font-size: 38px; color: var(--secret-primary); }
        .msg-once-box span { font-size: 12px; color: var(--text-muted); text-align: center; padding: 0 10px; }
        .msg-once-box.opened { opacity: 0.4; pointer-events: none; background: rgba(0,0,0,0.3); border-style: solid; border-color: rgba(255,255,255,0.05); }
        .msg-once-box.opened i { color: #444; }
        .msg-once-label {
            font-size: 10px; color: var(--secret-primary); font-weight: 600;
            display: flex; align-items: center; gap: 4px; opacity: 0.7;
        }

        /* NAV */
        .bottom-nav {
            display: flex; background: var(--bg-panel); border-top: 1px solid var(--glass-border);
            padding: 10px 0 15px 0; justify-content: space-around;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); cursor: pointer; font-size: 12px; transition: 0.3s; flex: 1;
        }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active-secreto { color: var(--secret-primary); }

        /* IMAGE VIEWER */
        #image-viewer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center;
        }
        #image-viewer img { max-width: 95%; max-height: 90%; border-radius: 10px; }
        .fechar-img { position: absolute; top: 20px; right: 25px; color: white; font-size: 40px; cursor: pointer; }

        /* EMOJI */
        .emoji-bar {
            display: flex; justify-content: space-evenly; padding: 8px; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); border-top: 1px solid var(--glass-border);
        }
        .emoji-btn { background: none; border: none; font-size: 22px; cursor: pointer; transition: 0.2s; }
        .emoji-btn:active { transform: scale(0.7); }

        .floating-emoji {
            position: fixed; bottom: 80px; font-size: 35px; pointer-events: none; z-index: 50;
            animation: floatUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes floatUp { 0% { opacity: 0; transform: translateY(20px) scale(0.5); } 20% { opacity: 1; transform: translateY(0) scale(1.2); } 100% { opacity: 0; transform: translateY(-400px) scale(1); } }

        /* TOAST */
        .toast {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(157, 0, 255, 0.9); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 13px; z-index: 10000; opacity: 0;
            transition: 0.3s; pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; bottom: 130px; }
        .toast.normal { background: rgba(255, 42, 75, 0.9); }
    </style>
</head>
<body>

    <div class="blur-overlay" id="blurOverlay">
        <i class="fa-solid fa-eye-slash"></i>
        <strong>Conteúdo protegido</strong>
        <span style="font-size:13px; color:var(--text-muted);">A captura de tela não é permitida.</span>
    </div>

    <div id="image-viewer">
        <span class="fechar-img" onclick="fecharImagem()">&times;</span>
        <img id="fullscreen-img" src="">
    </div>

    <div id="toast" class="toast"></div>

    <div id="login-screen">
        <div class="login-box">
            <i class="fa-solid fa-lock"></i>
            <h3>Acesso Restrito</h3>
            <p>Entre com o seu código</p>
            <input type="password" id="senha" class="senha" placeholder="••••" inputmode="numeric">
            <button class="btn-entrar" onclick="verificarSenha()">Entrar</button>
        </div>
    </div>

    <div id="app-screen">
        <div class="app-header">
            <div class="user-info">
                <span class="user-name" id="partner-name">Conectando...</span>
                <span class="user-status" id="partner-status">Buscando sinal</span>
            </div>
            <i class="fa-solid fa-shield-heart" style="color: var(--primary);"></i>
        </div>

        <div id="view-sintonia" class="view active">
            <div class="heart-wrapper">
                <div id="heart-btn" class="heart">🤍</div>
            </div>
            <div class="sintonia-text" id="sintonia-status">
                <strong>Verificando frequência...</strong>
            </div>
        </div>

        <div id="view-chat" class="view">
            <div class="messages" id="messages-normal"></div>
            <div class="emoji-bar">
                <button class="emoji-btn" onclick="enviarEmoji('🥺')">🥺</button>
                <button class="emoji-btn" onclick="enviarEmoji('😍')">😍</button>
                <button class="emoji-btn" onclick="enviarEmoji('😘')">😘</button>
                <button class="emoji-btn" onclick="enviarEmoji('💞')">💞</button>
                <button class="emoji-btn" onclick="enviarEmoji('🔥')">🔥</button>
            </div>
            <div class="reply-indicator" id="reply-box">
                <span id="reply-text">Respondendo a...</span>
                <i class="fa-solid fa-times" onclick="cancelarResposta()"></i>
            </div>
            <div class="chat-input-area">
                <button class="btn-action btn-attach" onclick="abrirAnexo('chat')"><i class="fa-solid fa-camera"></i></button>
                <input type="text" id="input-chat" placeholder="Digite uma mensagem..." onkeypress="verificarEnter(event, 'chat')">
                <button class="btn-action btn-send" onclick="enviarMensagem('chat')"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="view-secreto" class="view">
            <div class="secreto-header">
                <div class="info"><i class="fa-solid fa-user-secret"></i> Modo Privado</div>
                <button class="btn-burn" onclick="apagarSecreto()"><i class="fa-solid fa-fire"></i> Apagar & Sair</button>
            </div>
            <div class="messages" id="messages-secreto"></div>
            <div class="reply-indicator" id="reply-box-sec">
                <span id="reply-text-sec">Respondendo a...</span>
                <i class="fa-solid fa-times" onclick="cancelarResposta()"></i>
            </div>
            <div class="chat-input-area" style="background: var(--secret-bg);">
                <button class="btn-action btn-attach btn-view-once" onclick="abrirAnexo('secreto')" title="Foto visualização única">
                    <i class="fa-solid fa-camera"></i>
                </button>
                <input type="text" id="input-secreto" placeholder="Mensagem secreta..." onkeypress="verificarEnter(event, 'secreto')">
                <button class="btn-action btn-send" onclick="enviarMensagem('secreto')"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <input type="file" id="file-chat" accept="image/*" style="display: none;" onchange="processarImagem(event, 'chat')">
        <input type="file" id="file-secreto" accept="image/*" style="display: none;" onchange="processarImagem(event, 'secreto')">

        <div class="bottom-nav">
            <div class="nav-item active" onclick="mudarAba('sintonia', this)"><i class="fa-solid fa-heart-pulse"></i><span>Sintonia</span></div>
            <div class="nav-item" onclick="mudarAba('chat', this)"><i class="fa-solid fa-comment-dots"></i><span>Chat</span></div>
            <div class="nav-item" onclick="mudarAba('secreto', this)"><i class="fa-solid fa-mask"></i><span>Secreto</span></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, update, onDisconnect, serverTimestamp, remove, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD15BizvlLZEvZPi4VJDOJ-aI7t1lcNQi4",
            authDomain: "nosso-coracao.firebaseapp.com",
            databaseURL: "https://nosso-coracao-default-rtdb.firebaseio.com",
            projectId: "nosso-coracao",
            storageBucket: "nosso-coracao.firebasestorage.app",
            messagingSenderId: "560106544356",
            appId: "1:560106544356:web:25926da1705d98941da0f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let usuarioAtual = "";
        let parceiro = "";
        let nomeExibicaoParceiro = "";
        let dbRefs = {};
        let emojiRefs = {};

        let meuEstado = { state: "idle", time: 0, online: false };
        let estadoParceiro = { state: "idle", time: 0, online: false, last_seen: 0 };

        let msgEmResposta = null;
        let abaAtual = 'sintonia';

        const chatRef = ref(db, 'chat');
        const secretoRef = ref(db, 'chat_secreto');

        const mensagensUnicasAbertas = new Set();

        // Proteção contra print (dissuasor desktop)
        function ativarProtecaoPrint() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'PrintScreen' || e.keyCode === 44) {
                    e.preventDefault();
                    mostrarToast('📵 Captura de tela bloqueada.', 'secret');
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'S' || e.key === 's' || e.key === '3' || e.key === '4' || e.key === '5')) {
                    e.preventDefault();
                    mostrarToast('📵 Captura de tela bloqueada.', 'secret');
                    return false;
                }
            });
            document.addEventListener('visibilitychange', () => {
                const overlay = document.getElementById('blurOverlay');
                if (document.hidden) overlay.classList.add('show');
                else setTimeout(() => overlay.classList.remove('show'), 100);
            });
            window.addEventListener('blur', () => document.getElementById('blurOverlay').classList.add('show'));
            window.addEventListener('focus', () => setTimeout(() => document.getElementById('blurOverlay').classList.remove('show'), 100));
        }

        function formatarHora(timestamp) {
            if (!timestamp) return "";
            const d = new Date(timestamp);
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }
        function formatarDataHora(timestamp) {
            if (!timestamp) return "";
            const d = new Date(timestamp);
            const hoje = new Date();
            const eHoje = d.getDate() === hoje.getDate() && d.getMonth() === hoje.getMonth();
            const hora = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            return eHoje ? `hoje às ${hora}` : `${d.getDate()}/${d.getMonth()+1} às ${hora}`;
        }

        function mostrarToast(msg, tipo = 'secret') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (tipo === 'normal' ? ' normal' : '');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        window.fecharImagem = () => { document.getElementById('image-viewer').style.display = 'none'; }
        window.abrirImagem = (src) => {
            document.getElementById('fullscreen-img').src = src;
            document.getElementById('image-viewer').style.display = 'flex';
        }

        window.mudarAba = (aba, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(v => {
                v.classList.remove('active'); v.classList.remove('active-secreto');
            });
            document.getElementById(`view-${aba}`).classList.add('active');
            if (aba === 'secreto') el.classList.add('active-secreto');
            else el.classList.add('active');
            abaAtual = aba;
            cancelarResposta();
            setTimeout(() => {
                const area = document.getElementById(`messages-${aba === 'chat' ? 'normal' : 'secreto'}`);
                if (area) area.scrollTop = area.scrollHeight;
            }, 50);
        }

        window.verificarSenha = () => {
            const senha = document.getElementById('senha').value;
            if (senha === '1509') { inicializar('user_a', 'user_b', 'Coração'); }
            else if (senha === '1507') { inicializar('user_b', 'user_a', 'Coração'); }
            else {
                document.getElementById('senha').style.borderColor = 'var(--primary)';
                document.getElementById('senha').value = '';
                setTimeout(() => document.getElementById('senha').style.borderColor = 'var(--glass-border)', 1000);
            }
        }

        function inicializar(eu, outro, nomeOutro) {
            usuarioAtual = eu; parceiro = outro; nomeExibicaoParceiro = nomeOutro;
            document.getElementById('partner-name').innerText = nomeExibicaoParceiro;
            dbRefs.meu = ref(db, `status_users/${usuarioAtual}`);
            dbRefs.parceiro = ref(db, `status_users/${parceiro}`);
            emojiRefs.meu = ref(db, `emoji/${usuarioAtual}`);
            emojiRefs.parceiro = ref(db, `emoji/${parceiro}`);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            ativarProtecaoPrint();
            configurarPresenca();
            iniciarMonitoramento();
            carregarChat(chatRef, 'messages-normal', false);
            carregarChat(secretoRef, 'messages-secreto', true);
        }

        function configurarPresenca() {
            const connectedRef = ref(db, ".info/connected");
            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    onDisconnect(dbRefs.meu).update({ online: false, last_seen: serverTimestamp() });
                    update(dbRefs.meu, { online: true });
                }
            });
        }

        function atualizarHeaderESintonia() {
            const statusEl = document.getElementById('partner-status');
            const heartBtn = document.getElementById('heart-btn');
            const sintText = document.getElementById('sintonia-status');
            heartBtn.classList.remove('beating', 'connected');
            if (estadoParceiro.online) {
                statusEl.innerHTML = `<span class="status-online">Online</span>`;
            } else {
                statusEl.innerText = estadoParceiro.last_seen ? `Visto por último ${formatarDataHora(estadoParceiro.last_seen)}` : "Offline";
            }
            if (meuEstado.state === 'visto') {
                heartBtn.innerText = "❤️‍🔥"; heartBtn.classList.add('connected');
                sintText.innerHTML = `<strong>${nomeExibicaoParceiro} sentiu o seu coração! 🥰</strong>`;
                setTimeout(() => update(dbRefs.meu, { state: 'idle' }), 5000);
                return;
            }
            if (meuEstado.online && estadoParceiro.online) {
                heartBtn.innerText = "❤️‍🔥"; heartBtn.classList.add('connected');
                sintText.innerHTML = `<strong>Conexão Sincronizada 🔥</strong>Vocês estão online ao mesmo tempo!`;
                if (meuEstado.state === 'pensando') update(dbRefs.meu, { state: 'idle' });
                return;
            }
            if (estadoParceiro.state === 'pensando') {
                heartBtn.innerText = "❤️"; heartBtn.classList.add('beating');
                sintText.innerHTML = `<strong>${nomeExibicaoParceiro} pensou em si!</strong>Toque 2x para avisar que sentiu.`;
                return;
            }
            if (meuEstado.state === 'pensando') {
                heartBtn.innerText = "❤️";
                sintText.innerHTML = `<strong>Coração enviado...</strong>Aguardando ${nomeExibicaoParceiro} abrir a aplicação e sentir.`;
                return;
            }
            heartBtn.innerText = "🤍";
            sintText.innerHTML = `<strong>Modo de Espera</strong>${nomeExibicaoParceiro} está offline agora.<br>Toque 1x para deixar um coração para ela.`;
        }

        window.prepararResposta = (texto) => {
            msgEmResposta = texto;
            const isSec = abaAtual === 'secreto';
            document.getElementById(isSec ? 'reply-box-sec' : 'reply-box').style.display = 'flex';
            document.getElementById(isSec ? 'reply-text-sec' : 'reply-text').innerText = "Respondendo a: " + texto;
            document.getElementById(isSec ? 'input-secreto' : 'input-chat').focus();
        }

        window.cancelarResposta = () => {
            msgEmResposta = null;
            document.getElementById('reply-box').style.display = 'none';
            document.getElementById('reply-box-sec').style.display = 'none';
        }

        window.abrirAnexo = (tipo) => {
            if (tipo === 'secreto') mostrarToast('📸 A foto será de visualização única!', 'secret');
            document.getElementById(`file-${tipo}`).click();
        }

        window.enviarMensagem = (tipo) => {
            const input = document.getElementById(`input-${tipo}`);
            const texto = input.value.trim();
            if (texto === "") return;
            const targetRef = tipo === 'secreto' ? secretoRef : chatRef;
            const payload = { sender: usuarioAtual, tipo: 'texto', conteudo: texto, timestamp: serverTimestamp() };
            if (msgEmResposta) payload.replyTo = msgEmResposta;
            push(targetRef, payload);
            input.value = "";
            cancelarResposta();
        }

        window.verificarEnter = (e, tipo) => { if (e.key === "Enter") enviarMensagem(tipo); }

        window.processarImagem = (event, tipo) => {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 800; let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const base64Img = canvas.toDataURL('image/jpeg', 0.6);
                    const targetRef = tipo === 'secreto' ? secretoRef : chatRef;
                    if (tipo === 'secreto') {
                        push(targetRef, {
                            sender: usuarioAtual,
                            tipo: 'imagem_unica',
                            conteudo: base64Img,
                            timestamp: serverTimestamp(),
                            aberta: false
                        });
                        mostrarToast('📸 Foto enviada! Visualização única.', 'secret');
                    } else {
                        push(targetRef, {
                            sender: usuarioAtual,
                            tipo: 'imagem',
                            conteudo: base64Img,
                            timestamp: serverTimestamp()
                        });
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        window.apagarSecreto = () => {
            if (confirm('Apagar todas as mensagens secretas para ambos?')) {
                set(secretoRef, null);
                mensagensUnicasAbertas.clear();
                mostrarToast('🔥 Conversa secreta apagada!', 'secret');
                mudarAba('chat', document.querySelectorAll('.nav-item')[1]);
            }
        }

        // ABRIR FOTO ÚNICA: apaga o conteúdo do Firebase assim que abrir
        window.abrirFotoUnica = async (msgId, chave, conteudo, jaAberta) => {
            if (jaAberta || mensagensUnicasAbertas.has(chave)) {
                mostrarToast('Esta foto já foi vista.', 'secret');
                return;
            }
            mensagensUnicasAbertas.add(chave);
            try {
                // Apaga o conteúdo da imagem do Firebase (remove o base64)
                await update(ref(db, `chat_secreto/${chave}`), { 
                    aberta: true,
                    conteudo: null  // ISSO APAGA A FOTO DO BANCO
                });
            } catch (err) { console.warn('Erro ao apagar conteúdo', err); }
            abrirImagem(conteudo);
            mostrarToast('👁️ Foto aberta e apagada do servidor.', 'secret');
        }

        function carregarChat(refDB, containerId, isSecreto) {
            onValue(refDB, (snapshot) => {
                const area = document.getElementById(containerId);
                area.innerHTML = "";
                const msgArray = [];
                snapshot.forEach((child) => { msgArray.push({ chave: child.key, ...child.val() }); });
                msgArray.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                msgArray.forEach((msg) => {
                    const isMine = msg.sender === usuarioAtual;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'msg-wrapper ' + (isMine ? 'mine' : 'theirs');
                    const msgBox = document.createElement('div');
                    msgBox.className = 'msg-box';

                    let htmlConteudo = "";
                    if (msg.replyTo) htmlConteudo += `<div class="msg-reply-ref">${msg.replyTo}</div>`;

                    if (msg.tipo === 'imagem') {
                        msgBox.onclick = () => prepararResposta('📷 Imagem');
                        htmlConteudo += `<img src="${msg.conteudo}" onclick="abrirImagem(this.src)">`;
                        msgBox.style.background = 'transparent'; msgBox.style.padding = '0'; msgBox.style.border = 'none';
                    } else if (msg.tipo === 'imagem_unica') {
                        msgBox.style.background = 'transparent'; msgBox.style.padding = '0'; msgBox.style.border = 'none';
                        const jaAberta = msg.aberta === true || mensagensUnicasAbertas.has(msg.chave) || !msg.conteudo;
                        const msgId = `foto-${msg.chave}`;
                        const onceWrapper = document.createElement('div');
                        onceWrapper.className = 'msg-once-wrapper';
                        const label = document.createElement('div');
                        label.className = 'msg-once-label';
                        label.innerHTML = '<i class="fa-solid fa-eye-slash"></i> Visualização única';
                        const onceBox = document.createElement('div');
                        onceBox.className = 'msg-once-box' + (jaAberta ? ' opened' : '');
                        onceBox.id = msgId;
                        onceBox.innerHTML = jaAberta
                            ? '<i class="fa-solid fa-check-circle"></i><span>Foto já visualizada</span>'
                            : '<i class="fa-solid fa-camera"></i><span>Toque para ver a foto<br>(apenas uma vez)</span>';
                        if (!jaAberta) {
                            onceBox.onclick = () => {
                                window.abrirFotoUnica(msgId, msg.chave, msg.conteudo, false);
                                onceBox.classList.add('opened');
                                onceBox.innerHTML = '<i class="fa-solid fa-check-circle"></i><span>Foto visualizada</span>';
                            };
                        }
                        onceWrapper.appendChild(label);
                        onceWrapper.appendChild(onceBox);
                        msgBox.appendChild(onceWrapper);
                    } else {
                        msgBox.onclick = () => prepararResposta(msg.conteudo);
                        htmlConteudo += msg.conteudo;
                    }

                    if (msg.tipo === 'texto' || msg.tipo === 'imagem') {
                        msgBox.innerHTML = htmlConteudo;
                    }

                    const timeLabel = document.createElement('div');
                    timeLabel.className = 'msg-time';
                    timeLabel.innerText = formatarHora(msg.timestamp);
                    wrapper.appendChild(msgBox);
                    wrapper.appendChild(timeLabel);
                    area.appendChild(wrapper);
                });
                setTimeout(() => area.scrollTop = area.scrollHeight, 50);
            });
        }

        let ultimaVerificacaoEmoji = Date.now();
        window.enviarEmoji = (emoji) => {
            set(emojiRefs.meu, { icon: emoji, time: serverTimestamp() });
            criarAnimacaoEmoji(emoji);
        }
        function criarAnimacaoEmoji(emoji) {
            const el = document.createElement('div');
            el.innerText = emoji; el.className = 'floating-emoji';
            el.style.left = `${20 + Math.random() * 60}%`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function iniciarMonitoramento() {
            onValue(dbRefs.meu, (snap) => { meuEstado = snap.val() || meuEstado; atualizarHeaderESintonia(); });
            onValue(dbRefs.parceiro, (snap) => { estadoParceiro = snap.val() || estadoParceiro; atualizarHeaderESintonia(); });
            onValue(emojiRefs.parceiro, (snap) => {
                const data = snap.val();
                if (data && data.time > ultimaVerificacaoEmoji) {
                    ultimaVerificacaoEmoji = data.time;
                    criarAnimacaoEmoji(data.icon);
                }
            });
            let tapTimeout = null; let lastTap = 0;
            const heartBtn = document.getElementById('heart-btn');
            heartBtn.addEventListener('click', function() {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                if (tapLength < 400 && tapLength > 0) {
                    clearTimeout(tapTimeout);
                    if (estadoParceiro.state === 'pensando') {
                        update(dbRefs.parceiro, { state: 'visto', time: serverTimestamp() });
                    }
                } else {
                    tapTimeout = setTimeout(() => {
                        if (meuEstado.state !== 'pensando' && meuEstado.state !== 'visto') {
                            update(dbRefs.meu, { state: 'pensando', time: serverTimestamp() });
                        }
                    }, 400);
                }
                lastTap = currentTime;
            });
        }
    </script>
</body>
</html>
