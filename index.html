<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Coração</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1a0000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            text-align: center;
        }
        .container { display: none; width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        #login-screen { display: flex; flex-direction: column; gap: 15px; }
        input {
            padding: 15px; border-radius: 10px; border: none;
            font-size: 18px; text-align: center; background: #330000; color: white;
            width: 100%; box-sizing: border-box;
        }
        button {
            padding: 15px; border-radius: 10px; border: none;
            background: #ff3333; color: white; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.2s; width: 100%;
        }
        button:active { transform: scale(0.95); }
        
        .heart {
            font-size: 120px; margin: 40px auto;
            cursor: pointer; transition: transform 0.2s;
            user-select: none; -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.2));
            display: flex; align-items: center; justify-content: center;
            height: 150px; /* Mantém a altura fixa para não pular a tela */
        }
        
        /* Animação do coração batendo (quando recebe) */
        .heart.beating {
            animation: pulse 1s infinite alternate;
            filter: drop-shadow(0 0 30px rgba(255, 50, 0, 0.8));
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        /* Animação de quando o outro viu (Coração Mágico) */
        .heart.glowing {
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.5)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 105, 180, 1)); transform: scale(1.2); }
            100% { filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.5)); transform: scale(1); }
        }

        .status-text { font-size: 18px; min-height: 60px; color: #ff9999; }
        .instructions { font-size: 14px; color: #888; margin-top: 30px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- TELA 1: SENHA -->
    <div id="login-screen" class="container" style="display: flex;">
        <h2>Nosso Espaço</h2>
        <p style="color: #888; font-size: 14px; margin-top: -10px;">Digite sua senha pessoal</p>
        <input type="password" id="senha" placeholder="Senha numérica" inputmode="numeric">
        <button onclick="verificarSenha()">Entrar</button>
    </div>

    <!-- TELA 2: O CORAÇÃO -->
    <div id="app-screen" class="container">
        <h3 id="greeting">...</h3>
        <div id="heart-btn" class="heart">❤️</div>
        <div id="status" class="status-text">Conectando ao coração...</div>
        <div class="instructions">
            • Toque <b>1 vez</b> no coração para enviar um pensamento<br>
            • Toque <b>2 vezes</b> para avisar que viu o dela(e)
        </div>
    </div>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        // Suas chaves do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD15BizvlLZEvZPi4VJDOJ-aI7t1lcNQi4",
            authDomain: "nosso-coracao.firebaseapp.com",
            databaseURL: "https://nosso-coracao-default-rtdb.firebaseio.com",
            projectId: "nosso-coracao",
            storageBucket: "nosso-coracao.firebasestorage.app",
            messagingSenderId: "560106544356",
            appId: "1:560106544356:web:25926da1705d98941da0f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let usuarioAtual = "";
        let parceiro = "";
        let nomeExibicaoParceiro = "";
        let pronomeParceiro = "";
        
        let meuEstado = "idle";
        let estadoParceiro = "idle";

        let tapTimeout = null;
        let lastTap = 0;

        // Referências no banco de dados (agora guarda 'idle', 'pensando' ou 'visto')
        const dbRefs = {
            kevin: ref(db, 'status/kevin'), 
            Ana: ref(db, 'status/Ana') 
        };

        // Verifica a senha e define quem está acessando
        window.verificarSenha = function() {
            const senhaDigitada = document.getElementById('senha').value;

            if (senhaDigitada === '1509') {
                usuarioAtual = 'kevin';
                parceiro = 'Ana';
                nomeExibicaoParceiro = 'A Ana';
                pronomeParceiro = 'ela';
                prepararTela('Kevin', '💙');
            } else if (senhaDigitada === '1507') {
                usuarioAtual = 'Ana';
                parceiro = 'kevin';
                nomeExibicaoParceiro = 'O Kevin';
                pronomeParceiro = 'ele';
                prepararTela('Ana', '🔥');
            } else {
                alert('Senha incorreta!');
                document.getElementById('senha').value = '';
            }
        }

        function prepararTela(nomeExibicao, icone) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('greeting').innerText = `Olá, ${nomeExibicao} ${icone}`;
            
            // Força o estado inicial para limpar lixo antigo do banco
            set(dbRefs[usuarioAtual], 'idle');
            
            iniciarMonitoramento();
        }

        function atualizarTela() {
            const heartBtn = document.getElementById('heart-btn');
            const statusText = document.getElementById('status');

            // Limpa as animações para não acumularem
            heartBtn.classList.remove('beating', 'glowing');

            // SITUAÇÃO 1: O Parceiro viu o meu pensamento! (Uhuuul)
            if (meuEstado === 'visto') {
                statusText.innerHTML = `<b>${nomeExibicaoParceiro} sentiu o seu coração! 🥰✨</b>`;
                heartBtn.innerText = "💖";
                heartBtn.classList.add('glowing');
                
                // Volta ao normal sozinho depois de 4 segundos
                setTimeout(() => {
                    if(meuEstado === 'visto') set(dbRefs[usuarioAtual], 'idle');
                }, 4000);
                return; // Para a verificação aqui
            }

            // SITUAÇÃO 2: O Parceiro está pensando em mim
            if (estadoParceiro === 'pensando') {
                statusText.innerHTML = `<b>${nomeExibicaoParceiro} está pensando em você!</b><br>Toque 2 vezes para avisar que sentiu.`;
                heartBtn.innerText = "❤️";
                heartBtn.classList.add('beating');
                return;
            }

            // SITUAÇÃO 3: Eu mandei um pensamento e estou aguardando ela(e) ver
            if (meuEstado === 'pensando') {
                statusText.innerHTML = `Pensamento enviado...<br>Aguardando ${pronomeParceiro} sentir.`;
                heartBtn.innerText = "❤️";
                return;
            }

            // SITUAÇÃO 4: Tudo calmo (Ninguém enviou nada)
            statusText.innerHTML = "Tudo calmo por aqui.<br>Toque no coração para enviar um pensamento.";
            heartBtn.innerText = "❤️";
        }

        function iniciarMonitoramento() {
            const heartBtn = document.getElementById('heart-btn');

            // Fica escutando as mudanças do MEU estado (pra saber se ela(e) me deu 'visto')
            onValue(dbRefs[usuarioAtual], (snapshot) => {
                meuEstado = snapshot.val() || 'idle';
                atualizarTela();
            });

            // Fica escutando as mudanças do estado do PARCEIRO (pra saber se tá 'pensando' em mim)
            onValue(dbRefs[parceiro], (snapshot) => {
                estadoParceiro = snapshot.val() || 'idle';
                atualizarTela();
            });

            // Lógica do toque (simples e duplo)
            heartBtn.addEventListener('click', function(e) {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                
                if (tapLength < 500 && tapLength > 0) {
                    // ===== TOQUE DUPLO (Confirmação de que você viu) =====
                    clearTimeout(tapTimeout);
                    
                    // Só faz sentido dar toque duplo se o parceiro mandou algo
                    if (estadoParceiro === 'pensando') {
                        // Avisa o parceiro que VOCÊ viu
                        set(dbRefs[parceiro], 'visto');
                        
                        // Uma animação rápida na sua tela
                        heartBtn.innerText = "✨";
                        setTimeout(() => heartBtn.innerText = "❤️", 500);
                    }
                } else {
                    // ===== TOQUE ÚNICO (Enviando o pensamento) =====
                    tapTimeout = setTimeout(function() {
                        // Só envia se eu não estiver no meio de um envio
                        if (meuEstado !== 'pensando' && meuEstado !== 'visto') {
                            set(dbRefs[usuarioAtual], 'pensando');
                            
                            // Efeito rápido de click
                            heartBtn.style.transform = "scale(0.8)";
                            setTimeout(() => heartBtn.style.transform = "scale(1)", 150);
                        }
                    }, 500);
                }
                lastTap = currentTime;
            });
        }
    </script>
</body>
</html>
