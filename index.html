<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notas">
<meta name="robots" content="noindex,nofollow">
<title>Notas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --bg:#0c0709;
  --glass-surface:rgba(255,255,255,.07);
  --glass-surface-strong:rgba(28,16,21,.66);
  --glass-surface-dark:rgba(15,8,11,.70);
  --glass-border:rgba(255,225,232,.14);
  --glass-border-soft:rgba(255,225,232,.08);
  --glass-highlight:inset 0 1px 0 rgba(255,240,244,.20);
  --glass-blur:blur(28px) saturate(180%);
  --primary:#d93b5c; --primary2:#941b36; --fire:#e07a3f;
  --text:#f7f2f4; --muted:rgba(242,226,231,.56);
  --sec:#b8456e; --sec2:#731f3f;
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{
  position:fixed;inset:0;height:var(--vh,100dvh);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  display:flex;flex-direction:column;
  background:
    radial-gradient(85% 55% at 15% 8%, rgba(217,59,92,.20) 0%, transparent 62%),
    radial-gradient(80% 50% at 88% 24%, rgba(155,32,64,.16) 0%, transparent 60%),
    radial-gradient(90% 60% at 50% 96%, rgba(195,48,80,.15) 0%, transparent 65%),
    #0c0709;
}
body.sec-theme{
  background:
    radial-gradient(85% 55% at 18% 10%, rgba(168,48,92,.22) 0%, transparent 62%),
    radial-gradient(80% 50% at 86% 28%, rgba(110,26,62,.18) 0%, transparent 60%),
    radial-gradient(90% 60% at 50% 96%, rgba(138,36,74,.16) 0%, transparent 65%),
    #090508;
}
button,input,textarea{font-family:inherit}

/* ===== Escudo de privacidade discreto ===== */
#shield{
  position:fixed;inset:0;z-index:99999;
  background:rgba(10,6,8,.88);
  backdrop-filter:blur(36px) saturate(160%);-webkit-backdrop-filter:blur(36px) saturate(160%);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);font-size:13px;letter-spacing:.3px
}
#shield.show{display:flex}
#shield i{font-size:28px;color:rgba(255,225,232,.48)}

/* ===== Login Discreto (iOS Glass Carmim) ===== */
#login{
  position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 24px calc(24px + var(--sab));
  background:
    radial-gradient(95% 60% at 50% 0%,rgba(217,59,92,.12) 0%,transparent 65%),
    rgba(11,6,8,.62);
  backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
}
#login.hide{display:none}
.lock-icon{
  width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:22px;color:#ff8fa5;
  background:linear-gradient(145deg,rgba(217,59,92,.20),rgba(255,255,255,.04));
  border:1px solid rgba(255,175,192,.24);
  box-shadow:var(--glass-highlight),0 16px 36px rgba(0,0,0,.45);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  margin-bottom:20px;
}
#login p{font-size:14px;font-weight:500;color:var(--muted);margin:0 0 26px;letter-spacing:.2px}
.dots{display:flex;gap:18px;margin-bottom:34px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,215,225,.32);background:rgba(255,255,255,.04);transition:.18s cubic-bezier(.34,1.56,.64,1)}
.dot.on{background:#ff6b88;border-color:#ff8fa5;box-shadow:0 0 14px rgba(217,59,92,.7);transform:scale(1.16)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:15px 22px}
.key{
  height:78px;border-radius:50%;
  border:1px solid var(--glass-border);
  background:linear-gradient(155deg,rgba(255,255,255,.11),rgba(217,59,92,.05));
  box-shadow:var(--glass-highlight),0 8px 24px rgba(0,0,0,.3);
  color:var(--text);font-size:27px;font-weight:400;cursor:pointer;display:grid;place-items:center;
  transition:.14s;backdrop-filter:blur(22px) saturate(175%);-webkit-backdrop-filter:blur(22px) saturate(175%);
}
.key:active{background:rgba(217,59,92,.28);border-color:rgba(255,150,170,.4);transform:scale(.92)}
.key.ghost{background:none;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
.key.del{font-size:19px;color:var(--muted);background:rgba(255,255,255,.035);border-color:var(--glass-border-soft)}

/* ===== App ===== */
#app{display:none;flex-direction:column;flex:1;min-height:0;position:relative}
.app-header{
  padding:calc(12px + var(--sat)) 16px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(217,59,92,.04));
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 8px 28px rgba(0,0,0,.28);
  display:flex;align-items:center;gap:10px;z-index:10;
}
.avatar{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#ff859d;
  background:linear-gradient(145deg,rgba(217,59,92,.26),rgba(255,255,255,.05));
  border:1px solid rgba(255,165,185,.28);
  box-shadow:var(--glass-highlight),0 4px 14px rgba(217,59,92,.2);
  position:relative;flex-shrink:0;
}
.avatar .pres{position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#63585c;border:2px solid #120a0d;transition:.25s}
.avatar .pres.on{background:#34c759;box-shadow:0 0 8px rgba(52,199,89,.75)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px}
.who span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span.online{color:#62d482}
.who span.typing{color:#ff7b96;font-weight:500}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,.07);
  box-shadow:var(--glass-highlight);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:rgba(255,235,240,.82);font-size:14px;cursor:pointer;transition:.15s;display:grid;place-items:center;flex-shrink:0;
}
.icon-btn:active{transform:scale(.88);background:rgba(217,59,92,.24);color:#fff}
.icon-btn.active{background:rgba(217,59,92,.28);border-color:rgba(255,150,172,.45);color:#fff}

/* Barra de busca */
.search-bar{
  display:none;align-items:center;gap:8px;padding:8px 14px;
  background:rgba(255,255,255,.06);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-border);z-index:9;
}
.search-bar.show{display:flex;animation:pop .18s ease-out}
.search-bar i{color:var(--muted);font-size:13px}
.search-bar input{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none;-webkit-user-select:text;user-select:text}
.search-bar span{font-size:11px;color:var(--muted)}
.search-bar button{background:none;border:none;color:var(--muted);font-size:14px;padding:4px 6px;cursor:pointer}

.view{display:none;flex:1;min-height:0;flex-direction:column;position:relative}
.view.active{display:flex}

/* ===== Sintonia ===== */
#view-sintonia{
  align-items:center;justify-content:center;
  padding:20px 20px calc(86px + var(--sab));
  overflow:hidden;
  background:radial-gradient(75% 55% at 50% 42%,var(--aura,rgba(217,59,92,.05)) 0%,transparent 72%);
}
#view-sintonia[data-s=beating]{--aura:rgba(217,59,92,.26)}
#view-sintonia[data-s=sync]{--aura:rgba(224,122,63,.24)}
#view-sintonia[data-s=waiting]{--aura:rgba(217,59,92,.14)}
.days-pill{
  position:absolute;top:16px;font-size:12px;color:var(--muted);
  background:rgba(255,255,255,.07);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 8px 24px rgba(0,0,0,.24);
  padding:7px 16px;border-radius:22px;letter-spacing:.2px;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
}
.days-pill b{color:#ff7b96;font-weight:600}
.heart-stage{
  position:relative;width:230px;height:230px;display:grid;place-items:center;cursor:pointer;
  border-radius:50%;
  background:radial-gradient(circle,rgba(217,59,92,.09) 0%,rgba(255,255,255,.01) 68%,transparent 72%);
}
.ring{position:absolute;inset:25px;border-radius:50%;border:1.5px solid var(--primary);opacity:0}
.heart-svg{width:148px;height:148px;overflow:visible;transition:transform .2s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:2}
.heart-svg path{fill:rgba(217,59,92,.14);stroke:rgba(255,165,185,.48);stroke-width:.7;transition:fill .5s,stroke .5s,filter .5s}
.heart-stage:active .heart-svg{transform:scale(.9)}
[data-s=waiting] .heart-svg path{fill:rgba(217,59,92,.36);stroke:#ff8fa5;filter:drop-shadow(0 0 14px rgba(217,59,92,.55))}
[data-s=beating] .heart-svg{animation:beat 1.05s ease-in-out infinite}
[data-s=beating] .heart-svg path{fill:url(#gRed);stroke:#ffb8c6;stroke-width:.4;filter:drop-shadow(0 0 24px rgba(217,59,92,.85))}
[data-s=beating] .ring{animation:ring 2.1s ease-out infinite}
[data-s=beating] .ring:nth-child(2){animation-delay:1.05s}
[data-s=sync] .heart-svg{animation:fire 1.3s ease-in-out infinite alternate}
[data-s=sync] .heart-svg path{fill:url(#gFire);stroke:#ffd1a8;stroke-width:.4}
[data-s=sync] .ring{border-color:var(--fire);animation:ring 2.6s ease-out infinite}
[data-s=sync] .ring:nth-child(2){animation-delay:1.3s}
@keyframes beat{0%,100%{transform:scale(.94)}15%{transform:scale(1.11)}30%{transform:scale(.98)}45%{transform:scale(1.09)}}
@keyframes fire{0%{transform:scale(1);filter:drop-shadow(0 0 16px rgba(224,122,63,.5))}100%{transform:scale(1.07);filter:drop-shadow(0 0 38px rgba(217,59,92,.8))}}
@keyframes ring{0%{transform:scale(.7);opacity:.65}100%{transform:scale(1.75);opacity:0}}
.sint-text{margin-top:22px;text-align:center;min-height:80px;padding:0 10px}
.sint-text strong{display:block;font-size:18px;font-weight:600;margin-bottom:6px;letter-spacing:-.2px}
.sint-text span{font-size:14px;color:var(--muted);line-height:1.5}
.hint-chip{
  margin-top:6px;font-size:12px;color:var(--muted);
  background:rgba(255,255,255,.07);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight);
  padding:8px 16px;border-radius:22px;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
}
.hint-chip b{color:#ff9ab0;font-weight:600}
.stats{
  position:absolute;bottom:calc(82px + var(--sab));left:0;right:0;display:flex;justify-content:center;gap:28px;font-size:12px;color:var(--muted);
  background:rgba(255,255,255,.065);width:fit-content;margin:0 auto;padding:8px 20px;border-radius:24px;
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 10px 28px rgba(0,0,0,.3);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
}
.stats b{color:var(--text);font-size:14px;margin-right:5px}
.mini-heart{position:fixed;pointer-events:none;z-index:60;font-size:20px;animation:miniUp var(--d,2s) ease-out forwards}
@keyframes miniUp{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--x,0),-260px) scale(1.15) rotate(var(--r,0deg))}}

/* ===== Chat & Swipe to Reply ===== */
.messages-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.messages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 12px 16px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.day{
  align-self:center;font-size:11px;color:rgba(248,235,238,.74);
  background:rgba(255,255,255,.075);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:4px 13px;border-radius:14px;margin:12px 0 8px;font-weight:500;
}
.mw{display:flex;flex-direction:column;max-width:82%;position:relative;touch-action:pan-y;border-radius:20px}
.mw.mine{align-self:flex-end;align-items:flex-end}
.mw.theirs{align-self:flex-start;align-items:flex-start}
.mw.first{margin-top:8px}
.mw.has-like{margin-bottom:12px}
.mw.search-dim{opacity:.25;transition:.2s}
.mw.search-hit .bubble{box-shadow:0 0 0 2px #f2b46d}

/* Botão flutuante descer chat */
.scroll-btn{
  position:absolute;right:14px;bottom:12px;z-index:15;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.10);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 8px 22px rgba(0,0,0,.35);
  color:var(--text);display:none;place-items:center;font-size:14px;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(18px);cursor:pointer;
}
.scroll-btn.show{display:grid;animation:pop .2s ease-out}
.scroll-btn .sb-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--primary);display:none}
.scroll-btn.has-new .sb-dot{display:block}

/* Destaque ao clicar na mensagem respondida */
.mw.highlight .bubble{animation:msgHighlight 1.6s ease-out}
@keyframes msgHighlight{
  0%{box-shadow:0 0 0 0 rgba(217,59,92,0);filter:brightness(1)}
  20%{box-shadow:0 0 0 3px rgba(255,140,165,.55),0 0 22px rgba(217,59,92,.35);filter:brightness(1.22);transform:scale(1.02)}
  60%{box-shadow:0 0 0 2px rgba(255,140,165,.3);filter:brightness(1.08);transform:scale(1)}
  100%{box-shadow:none;filter:brightness(1)}
}

/* Ícone que aparece atrás ao arrastar para o lado */
.swipe-icon{
  position:absolute;left:-38px;top:50%;transform:translateY(-50%) scale(.4);
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.13);border:1px solid var(--glass-border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--text);display:grid;place-items:center;font-size:12px;
  opacity:0;pointer-events:none;transition:background .15s,color .15s;
}
.mw.mine .swipe-icon{left:auto;right:calc(100% + 10px)}
.swipe-icon.ready{background:var(--primary);color:#fff;border-color:rgba(255,255,255,.45)}

/* Balões em Vidro Carmim Sofisticado */
.bubble{
  padding:9px 14px 7px;border-radius:20px;font-size:15px;line-height:1.4;
  word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;
  position:relative;animation:pop .22s ease-out;will-change:transform;touch-action:pan-y;
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.mine .bubble{
  background:linear-gradient(145deg,rgba(196,46,78,.60),rgba(136,24,50,.50));
  border:1px solid rgba(255,165,185,.28);
  box-shadow:inset 0 1px 0 rgba(255,235,240,.28),0 6px 20px rgba(150,24,52,.24);
  color:#fff8fa;border-bottom-right-radius:6px;
}
.theirs .bubble{
  background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 6px 20px rgba(0,0,0,.24);
  border-bottom-left-radius:6px;
}
.mine.grouped .bubble{border-top-right-radius:8px}
.theirs.grouped .bubble{border-top-left-radius:8px}
.bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:10px;opacity:.72;margin-top:3px;white-space:normal}
.bubble .meta .read{color:#8ad4f5;opacity:1}

/* Reações */
.like-pill{
  position:absolute;bottom:-12px;left:10px;
  background:rgba(28,16,21,.84);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 4px 14px rgba(0,0,0,.35);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:12px;padding:1px 7px;font-size:12px;line-height:1.35;
  z-index:4;animation:likePop .26s cubic-bezier(.34,1.56,.64,1);
}
.mine .like-pill{left:auto;right:10px}
@keyframes likePop{0%{transform:scale(0)}70%{transform:scale(1.22)}100%{transform:scale(1)}}

/* Player de Áudio */
.voice-box{display:flex;align-items:center;gap:10px;min-width:195px;padding:2px 2px 1px}
.voice-play{
  width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.18);color:#fff;font-size:13px;
  box-shadow:var(--glass-highlight);
  display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.14s;
}
.theirs .voice-play{background:rgba(217,59,92,.22);color:#ff94aa;border-color:rgba(255,150,172,.3)}
.voice-play:active{transform:scale(.88)}
.voice-track{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.voice-bar{
  height:5px;border-radius:4px;background:rgba(255,255,255,.20);
  position:relative;cursor:pointer;overflow:hidden;
}
.theirs .voice-bar{background:rgba(255,255,255,.14)}
.voice-fill{height:100%;width:0%;background:#fff;border-radius:4px;transition:width .08s linear}
.theirs .voice-fill{background:#ff7b96}
.voice-time{font-size:11px;opacity:.86;font-variant-numeric:tabular-nums}

/* Mídia e Figurinhas */
.bubble.bare{background:none!important;border:none!important;padding:0;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.bubble.bare .meta{
  padding:4px 8px;
  background:rgba(16,9,12,.64);border:1px solid var(--glass-border-soft);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:10px;width:fit-content;margin-left:auto;margin-top:4px;
}
.bubble img.photo{display:block;width:215px;max-width:100%;height:auto;max-height:280px;object-fit:cover;border-radius:18px;border:1px solid var(--glass-border);box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:auto;-webkit-user-drag:none}
.bubble img.sticker{display:block;width:155px;height:155px;object-fit:contain;background:transparent;border:none;border-radius:8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));pointer-events:auto;-webkit-user-drag:none}

/* Citação clicável */
.reply-ref{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.09);
  border-left:3px solid rgba(255,190,205,.75);
  border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:12px;opacity:.94;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;cursor:pointer;transition:.15s;
}
.reply-ref:active{opacity:.65;transform:scale(.98)}
.reply-ref i{font-size:10px;opacity:.8;flex-shrink:0}
.bubble.bare .reply-ref{
  background:rgba(255,255,255,.09);border:1px solid var(--glass-border);
  border-left:3px solid var(--primary);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:4px;
}

/* Links 100% clicáveis */
.bubble a.lnk{
  color:#a8d5ff;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;
  font-weight:500;word-break:break-all;
  -webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default;
  pointer-events:auto;cursor:pointer;touch-action:manipulation;
  display:inline;padding:3px 2px;position:relative;z-index:3;
}
.mine .bubble a.lnk{color:#fff;text-decoration-color:rgba(255,255,255,.88)}
.bubble a.lnk:active{opacity:.65}
.bubble a.lnk::before{content:"\f0c1";font-family:"Font Awesome 6 Free";font-weight:900;font-size:.8em;margin-right:5px;opacity:.85;display:inline-block;text-decoration:none}

.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;padding:30px}
.empty i{display:block;font-size:28px;margin-bottom:10px;color:#e66c85;opacity:.85}

/* ===== Menu Rápido ao Segurar Mensagem (iOS Glass) ===== */
#ctx-backdrop{
  position:fixed;inset:0;z-index:8500;
  background:rgba(8,4,6,.56);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  display:none;align-items:center;justify-content:center;padding:20px;
}
#ctx-backdrop.show{display:flex;animation:fadeIn .16s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ctx-box{
  width:100%;max-width:290px;display:flex;flex-direction:column;gap:10px;
  animation:ctxPop .22s cubic-bezier(.22,1,.36,1);
}
@keyframes ctxPop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
.ctx-preview{
  background:rgba(255,255,255,.09);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 12px 32px rgba(0,0,0,.35);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-radius:18px;padding:11px 15px;font-size:13px;color:var(--text);
  max-height:92px;overflow:hidden;text-overflow:ellipsis;
}
.ctx-reacts{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(30,17,22,.76);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 12px 32px rgba(0,0,0,.38);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-radius:28px;padding:6px 10px;
}
.ctx-reacts button{
  width:38px;height:38px;border-radius:50%;border:none;background:none;
  font-size:22px;cursor:pointer;display:grid;place-items:center;transition:.14s;
}
.ctx-reacts button:active{transform:scale(1.25)}
.ctx-reacts button.picked{background:rgba(217,59,92,.25);box-shadow:var(--glass-highlight)}
.ctx-menu{
  background:rgba(30,17,22,.78);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 16px 40px rgba(0,0,0,.45);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-radius:20px;overflow:hidden;
}
.ctx-item{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;background:none;border:none;border-bottom:1px solid rgba(255,225,232,.08);
  color:var(--text);font-size:14px;font-weight:500;cursor:pointer;text-align:left;
}
.ctx-item:last-child{border-bottom:none}
.ctx-item:active{background:rgba(255,255,255,.1)}
.ctx-item i{font-size:15px;color:rgba(255,225,232,.68);width:18px;text-align:center}
.ctx-item.danger{color:#ff7b93}
.ctx-item.danger i{color:#ff7b93}

/* ===== Bandeja Rápida de Figurinhas ===== */
.sticker-tray{
  display:none;flex-direction:column;gap:10px;
  padding:12px;
  background:rgba(22,13,17,.74);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-top:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight);
  animation:trayUp .2s ease-out;
}
.sticker-tray.show{display:flex}
@keyframes trayUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tray-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tray-actions{display:flex;gap:8px;flex:1}
.tray-act{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 10px;border-radius:14px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,.07);
  box-shadow:var(--glass-highlight);
  color:var(--text);font-size:12px;font-weight:500;cursor:pointer;
}
.tray-act:active{transform:scale(.96);background:rgba(255,255,255,.15)}
.tray-act.paste-act i{color:#f2be7e}
.tray-act.pick-act i{color:#94c4eb}
.tray-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-border-soft);background:rgba(255,255,255,.07);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.tray-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  max-height:168px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px;
}
.tray-item{
  aspect-ratio:1;border-radius:16px;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-border-soft);
  box-shadow:var(--glass-highlight);
  display:grid;place-items:center;padding:6px;cursor:pointer;position:relative;transition:.14s;
}
.tray-item:active{transform:scale(.9);background:rgba(255,255,255,.14)}
.tray-item img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.tray-empty{grid-column:1/-1;text-align:center;font-size:12px;color:var(--muted);padding:16px 8px;line-height:1.45}

.quick{display:flex;gap:8px;padding:6px 12px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{
  flex:none;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,.065);
  box-shadow:var(--glass-highlight);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:20px;padding:5px 13px;font-size:19px;cursor:pointer;transition:.12s;
}
.quick button:active{transform:scale(.8);background:rgba(217,59,92,.2)}

.reply-bar{
  display:none;align-items:center;gap:10px;padding:9px 14px;
  background:rgba(255,255,255,.065);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-top:1px solid var(--glass-border);font-size:13px;color:var(--muted);
}
.reply-bar i.l{color:#ff859d}
.reply-bar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text)}
.reply-bar .x{padding:6px;cursor:pointer}

.composer{
  display:flex;align-items:center;gap:7px;
  padding:8px 10px calc(74px + var(--sab));
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(12,7,9,.72));
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--glass-border);position:relative;
}
.composer input[type=text]{
  flex:1;min-width:0;padding:11px 16px;border-radius:24px;
  background:rgba(255,255,255,.075);
  color:var(--text);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.22),var(--glass-highlight);
  font-size:16px;font-family:inherit;outline:none;-webkit-user-select:text;user-select:text;transition:.2s;
}
.composer input[type=text]::placeholder{color:rgba(242,226,231,.42)}
.composer input[type=text]:focus{border-color:rgba(255,150,172,.45);background:rgba(255,255,255,.11)}

/* Overlay de gravação de voz */
.rec-bar{
  display:none;flex:1;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 15px;border-radius:24px;
  background:rgba(217,59,92,.16);
  border:1px solid rgba(255,150,172,.35);
  box-shadow:var(--glass-highlight);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  min-width:0;
}
.composer.recording .rec-bar{display:flex}
.composer.recording input[type=text],
.composer.recording .attach,
.composer.recording .sticker-btn{display:none}
.rec-left{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#ff5c7c;box-shadow:0 0 8px #ff5c7c;animation:recPulse 1s infinite}
@keyframes recPulse{50%{opacity:.25;transform:scale(.8)}}
.rec-slide{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.rec-slide.cancel-warn{color:#ff8fa5;font-weight:600}

.round{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:grid;place-items:center;font-size:16px;cursor:pointer;flex-shrink:0;transition:.15s;touch-action:none;
}
.round:active{transform:scale(.88)}
.round.attach{background:rgba(255,255,255,.075);color:rgba(248,235,238,.78)}
.round.sticker-btn{background:rgba(255,255,255,.075);color:#f0c086}
.round.sticker-btn.open{background:rgba(240,192,134,.22);border-color:rgba(240,192,134,.45)}
.round.send{
  background:linear-gradient(145deg,rgba(217,59,92,.85),rgba(148,27,54,.78));
  border-color:rgba(255,170,188,.36);
  color:#fff;box-shadow:var(--glass-highlight),0 4px 16px rgba(180,32,64,.32);
}
.round.send.mic-mode{background:rgba(255,255,255,.075);color:#ff859d;border-color:var(--glass-border);box-shadow:var(--glass-highlight)}
.composer.recording .round.send{background:linear-gradient(145deg,#d93b5c,#941b36);color:#fff;transform:scale(1.16);box-shadow:0 0 22px rgba(217,59,92,.6)}

/* ===== Secreto (Bordô / Ameixa Profundo) ===== */
#view-secreto{background:transparent}
#view-secreto .mine .bubble{
  background:linear-gradient(145deg,rgba(155,48,88,.62),rgba(98,24,54,.54));
  border:1px solid rgba(235,155,188,.26);
  box-shadow:inset 0 1px 0 rgba(255,235,245,.24),0 6px 20px rgba(0,0,0,.28);
}
#view-secreto .theirs .bubble{
  background:linear-gradient(145deg,rgba(184,69,110,.15),rgba(255,255,255,.045));
  border-color:rgba(225,150,180,.2);
}
#view-secreto .composer{background:linear-gradient(180deg,rgba(184,69,110,.04),rgba(10,5,8,.72))}
#view-secreto .composer input[type=text]{background:rgba(184,69,110,.09);border-color:rgba(225,150,180,.22)}
#view-secreto .composer input[type=text]:focus{border-color:rgba(240,175,202,.45);background:rgba(184,69,110,.14)}
#view-secreto .round.send{background:linear-gradient(145deg,rgba(176,56,98,.85),rgba(115,31,63,.78));border-color:rgba(240,175,202,.34)}
#view-secreto .round.send.mic-mode{background:rgba(184,69,110,.12);color:#e69ab8;border-color:rgba(225,150,180,.24)}
#view-secreto .round.attach,#view-secreto .round.sticker-btn{background:rgba(184,69,110,.09);color:#e69ab8;border-color:rgba(225,150,180,.22)}
#view-secreto .sticker-tray{background:rgba(20,10,15,.76);border-top-color:rgba(225,150,180,.22)}
#view-secreto .reply-bar{background:rgba(184,69,110,.1)}
#view-secreto .day{background:rgba(184,69,110,.14);border-color:rgba(225,150,180,.22);color:#f0bdd2}
.sec-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;
  background:rgba(184,69,110,.11);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-bottom:1px solid rgba(225,150,180,.18);color:#ebb6cc;font-size:12px;font-weight:600;
}
.sec-head .l{display:flex;align-items:center;gap:8px}
.burn{
  display:flex;align-items:center;gap:6px;
  background:rgba(184,69,110,.16);border:1px solid rgba(235,165,192,.32);
  box-shadow:var(--glass-highlight);
  color:#f5cce0;border-radius:16px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;
}
.burn:active{background:rgba(184,69,110,.28);transform:scale(.95)}
.once{
  width:200px;height:170px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  background:linear-gradient(145deg,rgba(184,69,110,.22),rgba(255,255,255,.04));
  border:1.5px dashed rgba(235,165,192,.44);
  box-shadow:var(--glass-highlight),0 8px 24px rgba(0,0,0,.28);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:.2s;
}
.once:active{transform:scale(.96)}
.once i{font-size:30px;color:#e69ab8}
.once span{font-size:12px;color:#edd0dc;text-align:center;padding:0 12px;line-height:1.4}
.once.opened{opacity:.48;border-style:solid;border-color:var(--glass-border-soft);background:rgba(255,255,255,.03);cursor:default}
.once.opened i{color:#777}

/* ===== Mural (4ª Aba Estilo Instagram - Proporção Compacta e Usável) ===== */
.mural-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;
  background:rgba(255,255,255,.05);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-border);
  flex-shrink:0;
}
.mural-head .mh-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text)}
.mural-head .mh-title i{color:#ff7b96}
.mural-head-btns{display:flex;align-items:center;gap:7px}
.mural-cam-btn{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight);
  color:#ffd1db;font-size:13px;cursor:pointer;display:grid;place-items:center;transition:.15s;
}
.mural-cam-btn:active{transform:scale(.9);background:rgba(217,59,92,.25)}
.mural-add-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:18px;
  background:linear-gradient(145deg,rgba(217,59,92,.55),rgba(148,27,54,.45));
  border:1px solid rgba(255,165,185,.34);
  box-shadow:var(--glass-highlight),0 4px 14px rgba(180,32,64,.25);
  color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;
}
.mural-add-btn:active{transform:scale(.94)}

/* Barra de composição de novo post */
.mural-composer{
  display:none;flex-direction:column;gap:10px;padding:12px 14px;
  background:rgba(24,13,18,.82);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-border);
  animation:pop .2s ease-out;flex-shrink:0;
}
.mural-composer.show{display:flex}
.mc-row{display:flex;align-items:center;gap:10px}
.mc-thumb{
  width:54px;height:54px;border-radius:14px;object-fit:cover;
  border:1px solid var(--glass-border);flex-shrink:0;background:rgba(255,255,255,.05);
}
.mc-input{
  flex:1;min-width:0;padding:10px 13px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid var(--glass-border);
  color:var(--text);font-size:14px;outline:none;-webkit-user-select:text;user-select:text;
}
.mc-input::placeholder{color:var(--muted)}
.mc-actions{display:flex;justify-content:flex-end;gap:8px}
.mc-btn{
  padding:7px 14px;border-radius:14px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--glass-border);background:rgba(255,255,255,.07);color:var(--muted);
}
.mc-btn.pub{background:linear-gradient(145deg,rgba(217,59,92,.78),rgba(148,27,54,.7));color:#fff;border-color:rgba(255,165,185,.38);box-shadow:var(--glass-highlight)}
.mc-btn:active{transform:scale(.95)}

/* Feed de cards estilo Instagram (Foto com altura controlada para caber curtida + comentário na tela) */
.mural-feed{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:12px 12px calc(130px + var(--sab));
  display:flex;flex-direction:column;gap:16px;
  -webkit-overflow-scrolling:touch;
}
.post-card{
  border-radius:22px;overflow:hidden;flex-shrink:0;
  background:linear-gradient(155deg,rgba(255,255,255,.085),rgba(217,59,92,.04));
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-highlight),0 12px 32px rgba(0,0,0,.35);
  backdrop-filter:blur(24px) saturate(175%);-webkit-backdrop-filter:blur(24px) saturate(175%);
  animation:pop .22s ease-out;
}
.post-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 13px;
}
.post-author{display:flex;align-items:center;gap:9px;min-width:0}
.post-av{
  width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;
  background:linear-gradient(145deg,rgba(217,59,92,.4),rgba(255,255,255,.1));
  border:1px solid rgba(255,165,185,.28);flex-shrink:0;
}
.post-meta{display:flex;flex-direction:column;min-width:0}
.post-meta b{font-size:13px;font-weight:600;color:var(--text)}
.post-meta span{font-size:10.5px;color:var(--muted)}
.post-top-btns{display:flex;align-items:center;gap:6px}
.post-del{
  width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.06);color:var(--muted);
  display:grid;place-items:center;font-size:12px;cursor:pointer;transition:.15s;
}
.post-del:active{transform:scale(.88);background:rgba(217,59,92,.25);color:#ff859d}

.post-media{
  position:relative;width:100%;background:rgba(0,0,0,.32);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.post-media img{
  width:100%;max-height:43dvh;object-fit:cover;display:block;
  pointer-events:auto;-webkit-user-drag:none;
}
.post-big-heart{
  position:absolute;font-size:74px;color:#ff6b88;
  filter:drop-shadow(0 6px 22px rgba(0,0,0,.55));
  pointer-events:none;opacity:0;transform:scale(.3);
}
.post-big-heart.burst{animation:heartBurst .75s cubic-bezier(.22,1,.36,1) forwards}
@keyframes heartBurst{
  0%{opacity:0;transform:scale(.3)}
  25%{opacity:1;transform:scale(1.15)}
  60%{opacity:1;transform:scale(.96)}
  100%{opacity:0;transform:scale(1.1)}
}

.post-actions{
  display:flex;align-items:center;gap:8px;padding:9px 12px 6px;
}
.pa-btn{
  background:rgba(255,255,255,.07);border:1px solid var(--glass-border-soft);
  border-radius:16px;padding:6px 12px;color:rgba(248,235,238,.88);
  font-size:15px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.14s;
}
.pa-btn:active{transform:scale(.9)}
.pa-btn.liked{background:rgba(217,59,92,.24);border-color:rgba(255,145,168,.38);color:#ff6b88}
.pa-btn span{font-size:12px;font-weight:600;color:var(--text)}

.post-body{padding:2px 13px 8px;display:flex;flex-direction:column;gap:6px}
.post-caption{font-size:13.5px;line-height:1.4;color:var(--text);word-break:break-word}
.post-caption b{font-weight:600;margin-right:5px;color:#ffb8c6}

/* Comentários do post */
.post-comments{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.pc-item{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  font-size:12.5px;line-height:1.38;color:rgba(248,235,238,.88);
  padding:5px 9px;border-radius:11px;background:rgba(255,255,255,.05);
}
.pc-item b{font-weight:600;color:#ffb8c6;margin-right:5px}
.pc-del{background:none;border:none;color:var(--muted);font-size:11px;padding:2px 4px;cursor:pointer;flex-shrink:0}

.post-comment-form{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px 11px;border-top:1px solid rgba(255,225,232,.08);
}
.post-comment-form input{
  flex:1;min-width:0;background:rgba(255,255,255,.07);
  border:1px solid var(--glass-border-soft);border-radius:18px;
  padding:8px 13px;font-size:13.5px;color:var(--text);outline:none;
  -webkit-user-select:text;user-select:text;
}
.post-comment-form input::placeholder{color:var(--muted)}
.post-comment-form button{
  background:rgba(217,59,92,.25);border:1px solid rgba(255,150,172,.3);
  border-radius:15px;color:#ff94aa;font-size:12px;font-weight:600;
  padding:7px 12px;cursor:pointer;flex-shrink:0;
}
.post-comment-form button:active{transform:scale(.94)}

/* ===== Nav (Pílula Flutuante de Vidro Carmim - 4 Abas) ===== */
.nav{
  position:fixed;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);
  width:min(368px,calc(100% - 24px));
  display:flex;align-items:center;gap:3px;
  padding:5px;border-radius:34px;z-index:40;
  background:linear-gradient(180deg,rgba(255,255,255,.11) 0%,rgba(217,59,92,.06) 100%);
  backdrop-filter:blur(32px) saturate(190%);-webkit-backdrop-filter:blur(32px) saturate(190%);
  border:1px solid rgba(255,215,225,.18);
  box-shadow:
    inset 0 1px 0 rgba(255,240,244,.28),
    inset 0 -1px 0 rgba(255,255,255,.05),
    0 14px 36px rgba(0,0,0,.55);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:rgba(242,226,231,.6);font-size:10px;font-weight:600;letter-spacing:.1px;
  padding:7px 2px;border-radius:28px;cursor:pointer;position:relative;
  transition:background .24s cubic-bezier(.22,1,.36,1),color .2s,transform .15s,box-shadow .24s;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, update, remove, onDisconnect, serverTimestamp, increment, query, limitToLast } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD15BizvlLZEvZPi4VJDOJ-aI7t1lcNQi4",
  authDomain: "nosso-coracao.firebaseapp.com",
  databaseURL: "https://nosso-coracao-default-rtdb.firebaseio.com",
  projectId: "nosso-coracao",
  storageBucket: "nosso-coracao.firebasestorage.app",
  messagingSenderId: "560106544356",
  appId: "1:560106544356:web:25926da1705d98941da0f1"
};
const db = getDatabase(initializeApp(firebaseConfig));

const $ = id => document.getElementById(id);
const NOME_PARCEIRO = 'Coração';
const PINS = { '1509': ['user_a', 'user_b'], '1507': ['user_b', 'user_a'] };
const LOCK_AFTER_MS = 60000;
const PATH = { chat: 'chat', secreto: 'chat_secreto' };
const STICKER_STORAGE_KEY = 'ne_recent_stickers_v1';
const MAX_RECENT_STICKERS = 16;
const DATA_INICIO = '2026-08-01';

let eu = '', outro = '';
let R = {};
let appReady = false, locked = true;
let meu = { state: 'idle', online: false };
let par = { state: 'idle', online: false };
let aba = 'sintonia';
let respondendo = null;
let editando = null;
let hiddenAt = 0;
let ultimoSwipeEm = 0;
let ctxAlvo = null;
let muralPosts = [];
let muralNovaFotoB64 = '';
const cache = { chat: [], secreto: [] };
const lastReadSeen = { chat: 0, secreto: 0 };

/* ---------- contador de dias ---------- */
function atualizarDiasJuntos() {
  if (!DATA_INICIO) return;
  const inicio = new Date(DATA_INICIO + 'T00:00:00');
  if (isNaN(inicio.getTime())) return;
  const dias = Math.max(1, Math.floor((Date.now() - inicio.getTime()) / 86400000));
  const pill = $('days-pill');
  pill.innerHTML = `✨ <b>${dias}</b> ${dias === 1 ? 'dia' : 'dias'} conectados`;
  pill.style.display = 'block';
}
atualizarDiasJuntos();

/* ---------- altura real com teclado (iOS/Android) ---------- */
const vv = window.visualViewport;
function fitViewport() {
  document.documentElement.style.setProperty('--vh', (vv ? vv.height : innerHeight) + 'px');
  window.scrollTo(0, 0);
  if (aba === 'chat' || aba === 'secreto') scrollBottom(aba, true);
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }
window.addEventListener('resize', fitViewport);
fitViewport();

/* ---------- utilidades ---------- */
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2500);
}
const vibrar = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fmtSec = s => { const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, '0')}`; };
function diaLabel(ts) {
  const d = new Date(ts), h = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(h.getFullYear(), h.getMonth(), h.getDate());
  const diff = Math.round((b - a) / 86400000);
  if (diff === 0) return 'Hoje';
  if (diff === 1) return 'Ontem';
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
}
function tempoPost(ts) {
  if (!ts) return 'agora';
  const d = new Date(ts), h = new Date();
  if (d.toDateString() === h.toDateString()) return `Hoje às ${hhmm(ts)}`;
  return `${diaLabel(ts)} às ${hhmm(ts)}`;
}
function visto(ts) {
  if (!ts) return 'offline';
  const d = new Date(ts), h = new Date();
  const hoje = d.toDateString() === h.toDateString();
  return hoje ? `visto hoje às ${hhmm(ts)}` : `visto ${diaLabel(ts).toLowerCase()} às ${hhmm(ts)}`;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ---------- busca na conversa ---------- */
function fecharBusca() {
  $('search-bar').classList.remove('show');
  $('btn-search').classList.remove('active');
  $('search-input').value = '';
  $('search-count').textContent = '';
  document.querySelectorAll('.mw').forEach(w => w.classList.remove('search-dim', 'search-hit'));
}
$('btn-search').addEventListener('click', () => {
  const sb = $('search-bar');
  if (sb.classList.contains('show')) {
    fecharBusca();
  } else {
    sb.classList.add('show');
    $('btn-search').classList.add('active');
    $('search-input').focus();
  }
});
$('search-close').addEventListener('click', fecharBusca);
$('search-input').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (aba !== 'chat' && aba !== 'secreto') return;
  const area = $('messages-' + aba);
  const items = area.querySelectorAll('.mw');
  if (!q) {
    $('search-count').textContent = '';
    items.forEach(w => w.classList.remove('search-dim', 'search-hit'));
    return;
  }
  let hits = 0, ultimoHit = null;
  items.forEach(w => {
    const txt = (w.dataset.searchText || '').toLowerCase();
    if (txt.includes(q)) {
      w.classList.remove('search-dim');
      w.classList.add('search-hit');
      hits++;
      ultimoHit = w;
    } else {
      w.classList.add('search-dim');
      w.classList.remove('search-hit');
    }
  });
  $('search-count').textContent = hits ? `${hits}` : '0';
  if (ultimoHit) ultimoHit.scrollIntoView({ behavior: 'smooth', block: 'center' });
});

/* ---------- menu contextual flutuante ao segurar ---------- */
function abrirMenuContextual(tab, m, resumo, mine) {
  ctxAlvo = { tab, m, resumo, mine };
  const preview = $('ctx-preview');
  preview.textContent = resumo || 'Mensagem';

  const minhaReacao = (m.likes && m.likes[eu]) || null;
  document.querySelectorAll('#ctx-reacts button').forEach(btn => {
    const r = btn.dataset.r;
    const ativo = (minhaReacao === true && r === '❤️') || (minhaReacao === r);
    btn.classList.toggle('picked', ativo);
  });

  const menu = $('ctx-menu');
  menu.innerHTML = '';

  const addItem = (label, icon, fn, danger = false) => {
    const btn = el('button', 'ctx-item' + (danger ? ' danger' : ''));
    btn.type = 'button';
    btn.innerHTML = `<span>${label}</span><i class="fa-solid ${icon}"></i>`;
    btn.addEventListener('click', () => {
      fecharMenuContextual();
      fn();
    });
    menu.appendChild(btn);
  };

  addItem('Responder', 'fa-reply', () => iniciarResposta({ chave: m.chave, texto: resumo }));

  if (m.tipo === 'texto' && m.conteudo) {
    addItem('Copiar texto', 'fa-copy', async () => {
      try {
        await navigator.clipboard.writeText(m.conteudo);
        toast('Texto copiado');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = m.conteudo;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('Texto copiado');
      }
    });
  }

  if (mine && m.tipo === 'texto') {
    addItem('Editar mensagem', 'fa-pen', () => iniciarEdicao(tab, m));
  }

  if (mine) {
    addItem('Apagar para os dois', 'fa-trash', () => {
      if (confirm('Apagar esta mensagem para os dois?')) {
        remove(ref(db, `${PATH[tab]}/${m.chave}`));
        toast('Mensagem apagada');
      }
    }, true);
  }

  $('ctx-backdrop').classList.add('show');
}

function fecharMenuContextual() {
  $('ctx-backdrop').classList.remove('show');
  ctxAlvo = null;
}
$('ctx-backdrop').addEventListener('click', e => {
  if (e.target.id === 'ctx-backdrop') fecharMenuContextual();
});
$('ctx-reacts').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || !ctxAlvo) return;
  const emoji = btn.dataset.r;
  const { tab, m } = ctxAlvo;
  const atual = (m.likes && m.likes[eu]) || null;
  const mesmo = (atual === true && emoji === '❤️') || (atual === emoji);
  update(ref(db, `${PATH[tab]}/${m.chave}/likes`), { [eu]: mesmo ? null : emoji });
  vibrar(14);
  fecharMenuContextual();
});

/* ---------- histórico local de figurinhas ---------- */
function getRecentStickers() {
  try {
    const raw = localStorage.getItem(STICKER_STORAGE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}
function saveRecentSticker(dataUrl) {
  if (!dataUrl || typeof dataUrl !== 'string') return;
  try {
    let list = getRecentStickers().filter(item => item !== dataUrl);

      menor.unshift(dataUrl);
      localStorage.setItem(STICKER_STORAGE_KEY, JSON.stringify(menor));
    } catch (_) {}

/* ---------- links clicáveis ---------- */
const URL_RE = /((?:https?:\/\/|www\.)[^\s<>"]+|(?:[a-z0-9-]+\.)*(?:instagram\.com|instagr\.am|youtu\.be|youtube\.com|tiktok\.com|vm\.tiktok\.com|twitter\.com|x\.com|facebook\.com|fb\.watch|spotify\.com|open\.spotify\.com|wa\.me|pinterest\.com|pin\.it|g\.co|maps\.app\.goo\.gl|goo\.gl)\/[^\s<>"]*)/gi;
const TRAIL_RE = /[.,;:!?)\]}'"»…]+$/;

function normalizarUrl(raw) {
  const href = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
  try {
    const u = new URL(href);
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
    return u;
  } catch (e) { return null; }
}
function rotuloUrl(u) {
  let txt = u.hostname.replace(/^www\./, '') + (u.pathname !== '/' ? u.pathname : '');
  if (txt.length > 38) txt = txt.slice(0, 37) + '…';
  return txt;
}
function adicionarTexto(container, texto) {
  if (!texto) return;
  URL_RE.lastIndex = 0;
  let ultimo = 0, m;
  while ((m = URL_RE.exec(texto)) !== null) {
    let bruto = m[0];
    const sobra = (bruto.match(TRAIL_RE) || [''])[0];
    if (sobra) bruto = bruto.slice(0, bruto.length - sobra.length);
    const u = bruto ? normalizarUrl(bruto) : null;
    if (!u) continue;
    if (m.index > ultimo) container.appendChild(document.createTextNode(texto.slice(ultimo, m.index)));
    const a = el('a', 'lnk', rotuloUrl(u));
    a.href = u.href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    container.appendChild(a);
    ultimo = m.index + bruto.length;
    URL_RE.lastIndex = ultimo;
  }
  if (ultimo < texto.length) container.appendChild(document.createTextNode(texto.slice(ultimo)));
}

          saveRecentSticker(val.conteudo);

      });
      arr.sort((x, y) => (x.timestamp || 0) - (y.timestamp || 0));
      cache[t] = arr; renderTab(t); atualizarBadges(); marcarLido();
    });

  onValue(query(ref(db, 'mural_posts'), limitToLast(60)), snap => {

/* ---------- renderização do chat + Player de Áudio + Gestos ---------- */
const ehLink = ev => !!(ev.target && ev.target.closest && ev.target.closest('a.lnk'));
let audioAtual = null, btnAudioAtual = null;

function criarPlayerAudio(m) {
  const box = el('div', 'voice-box');
  const btn = el('button', 'voice-play');
  btn.type = 'button';
  btn.innerHTML = '<i class="fa-solid fa-play"></i>';

  const track = el('div', 'voice-track');
  const bar = el('div', 'voice-bar');
  const fill = el('div', 'voice-fill');
  bar.appendChild(fill);

  const durInicial = m.duracao || 0;
  const timeLbl = el('span', 'voice-time', fmtSec(durInicial));
  track.append(bar, timeLbl);
  box.append(btn, track);

  let audio = null;

  const pararEste = () => {
    if (audio) {
      audio.pause();
      audio.currentTime = 0;
    }
    btn.innerHTML = '<i class="fa-solid fa-play"></i>';
    fill.style.width = '0%';
    timeLbl.textContent = fmtSec(durInicial);
  };

  btn.addEventListener('click', ev => {
    ev.stopPropagation();
    if (Date.now() - ultimoSwipeEm < 300) return;

    if (!audio) {
      audio = new Audio(m.conteudo);
      audio.preload = 'metadata';
      audio.addEventListener('timeupdate', () => {
        if (!audio.duration || isNaN(audio.duration)) return;
        const pct = Math.min(100, (audio.currentTime / audio.duration) * 100);
        fill.style.width = pct + '%';
        timeLbl.textContent = fmtSec(audio.currentTime);
      });
      audio.addEventListener('ended', () => {
        pararEste();
        if (audioAtual === audio) { audioAtual = null; btnAudioAtual = null; }
      });
    }

    if (!audio.paused) {
      audio.pause();
      btn.innerHTML = '<i class="fa-solid fa-play"></i>';
      return;
    }

    if (audioAtual && audioAtual !== audio) {
      audioAtual.pause();
      if (btnAudioAtual) btnAudioAtual.innerHTML = '<i class="fa-solid fa-play"></i>';
    }

    audioAtual = audio;
    btnAudioAtual = btn;
    btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    audio.play().catch(() => {
      btn.innerHTML = '<i class="fa-solid fa-play"></i>';
      toast('Não foi possível reproduzir o áudio');
    });
  });

  bar.addEventListener('click', ev => {
    ev.stopPropagation();
    if (!audio || !audio.duration || isNaN(audio.duration)) return;
    const rect = bar.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
    audio.currentTime = ratio * audio.duration;
  });

  return box;
}

function configurarGestosBolha(wrapper, bubble, swipeIcon, onSwipeReply, onDoubleTapLike, onLongMenu) {
  let startX = 0, startY = 0, dx = 0;
  let tracking = false, swiping = false, vibrado = false;
  let longTimer = null, longFired = false;
  let lastTapTime = 0;
  const THRESHOLD = 52;

  const limparTimer = () => { if (longTimer) { clearTimeout(longTimer); longTimer = null; } };

  const onStart = ev => {
    if (ev.touches.length !== 1) return;
    const t = ev.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    dx = 0;
    tracking = true;
    swiping = false;
    vibrado = false;
    longFired = false;

    bubble.style.transition = 'none';
    swipeIcon.style.transition = 'none';

    if (onLongMenu && !ehLink(ev)) {
      longTimer = setTimeout(() => {
        longFired = true;
        tracking = false;
        vibrar(22);
        onLongMenu();
      }, 480);
    }
  };

  const onMove = ev => {
    if (!tracking || ev.touches.length !== 1) return;
    const t = ev.touches[0];
    const diffX = t.clientX - startX;
    const diffY = t.clientY - startY;

    if (Math.abs(diffX) > 7 || Math.abs(diffY) > 7) limparTimer();

    if (!swiping) {
      if (Math.abs(diffY) > Math.abs(diffX) || diffX < 0) {
        tracking = false;
        return;
      }
      if (diffX > 8) {
        swiping = true;
        ultimoSwipeEm = Date.now();
      }
    }

    if (swiping) {
      if (ev.cancelable) ev.preventDefault();
      ultimoSwipeEm = Date.now();
      dx = Math.min(82, diffX * 0.75);
      bubble.style.transform = `translateX(${dx}px)`;

      const prog = Math.min(1, dx / THRESHOLD);
      swipeIcon.style.opacity = String(prog);
      swipeIcon.style.transform = `translateY(-50%) scale(${0.5 + prog * 0.5})`;

      if (dx >= THRESHOLD && !vibrado) {
        vibrado = true;
        vibrar(14);
        swipeIcon.classList.add('ready');
      } else if (dx < THRESHOLD && vibrado) {
        vibrado = false;
        swipeIcon.classList.remove('ready');
      }
    }
  };

  const finalizarToque = ev => {
    limparTimer();
    if (!tracking && !swiping) return;
    const eraSwipe = swiping;
    const disparar = swiping && dx >= THRESHOLD;
    if (swiping) ultimoSwipeEm = Date.now();
    tracking = false;
    swiping = false;

    bubble.style.transition = 'transform .24s cubic-bezier(.22,1,.36,1)';
    swipeIcon.style.transition = 'opacity .2s, transform .2s';
    bubble.style.transform = 'translateX(0)';
    swipeIcon.style.opacity = '0';
    swipeIcon.style.transform = 'translateY(-50%) scale(.4)';
    swipeIcon.classList.remove('ready');

    if (disparar && onSwipeReply) {
      setTimeout(() => onSwipeReply(), 80);
      return;
    }

    if (!eraSwipe && !longFired && !ehLink(ev) && !ev.target.closest('.voice-play, .voice-bar') && onDoubleTapLike) {
      const agora = Date.now();
      if (agora - lastTapTime < 280) {
        lastTapTime = 0;
        onDoubleTapLike();
      } else {
        lastTapTime = agora;
      }
    }
  };

  wrapper.addEventListener('touchstart', onStart, { passive: true });
  wrapper.addEventListener('touchmove', onMove, { passive: false });
  wrapper.addEventListener('touchend', finalizarToque);
  wrapper.addEventListener('touchcancel', finalizarToque);

  bubble.addEventListener('contextmenu', e => {
    if (ehLink(e)) return;
    e.preventDefault();
    if (!longFired && onLongMenu) onLongMenu();
  });
}

function prepararFotoMural(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1080;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
      else { if (h > MAX) { w *= MAX / h; h = MAX; } }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      muralNovaFotoB64 = c.toDataURL('image/jpeg', 0.72);
      $('mc-thumb').src = muralNovaFotoB64;
      $('mc-caption').value = '';
      $('mural-composer').classList.add('show');
      $('mc-caption').focus();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
$('file-mural').addEventListener('change', prepararFotoMural);

/* ---------- alternância Microfone / Enviar + Gravador de Voz ---------- */
function atualizarBotaoAcao(tab) {
  const inp = $('input-' + tab);
  const btn = $('action-' + tab);
  if (!inp || !btn) return;
  const temTexto = inp.value.trim().length > 0;
  if (temTexto) {
    btn.classList.remove('mic-mode');
    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
  } else {
    btn.classList.add('mic-mode');
    btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
  }
}

let recState = {
  ativo: false,
  tab: null,
  stream: null,
  recorder: null,
  chunks: [],
  inicio: 0,
  timerInt: null,
  startX: 0,
  cancelado: false
};

function cancelarGravacao() {
  if (!recState.ativo) return;
  recState.cancelado = true;
  clearInterval(recState.timerInt);
  try { if (recState.recorder && recState.recorder.state !== 'inactive') recState.recorder.stop(); } catch (e) {}
  try { if (recState.stream) recState.stream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
  if (recState.tab) {
    $('composer-' + recState.tab).classList.remove('recording');
    $('rec-slide-' + recState.tab).classList.remove('cancel-warn');
    $('rec-slide-' + recState.tab).textContent = '◀ Deslize para cancelar';
  }
  recState = { ativo: false, tab: null, stream: null, recorder: null, chunks: [], inicio: 0, timerInt: null, startX: 0, cancelado: false };
}

async function iniciarGravacao(tab, clientX) {
  if (recState.ativo) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    toast('Gravação de áudio não suportada neste navegador');
    return;
  }
  fecharTodasBandejas();
  recState.ativo = true;
  recState.tab = tab;
  recState.startX = clientX || 0;
  recState.cancelado = false;
  recState.chunks = [];

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!recState.ativo || recState.cancelado) {
      stream.getTracks().forEach(tr => tr.stop());
      return;
    }
    recState.stream = stream;

    const mimeCandidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
    const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    const recorder = new MediaRecorder(stream, mimeType ? { mimeType, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
    recState.recorder = recorder;
    recState.inicio = Date.now();

    $('composer-' + tab).classList.add('recording');
    $('rec-timer-' + tab).textContent = '0:00';
    vibrar(18);

    recState.timerInt = setInterval(() => {
      const segs = Math.floor((Date.now() - recState.inicio) / 1000);
      $('rec-timer-' + tab).textContent = fmtSec(segs);
      if (segs >= 60) finalizarGravacao();
    }, 250);

    recorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recState.chunks.push(e.data);
    };

    recorder.onstop = () => {
      const foiCancelado = recState.cancelado;
      const duracaoSeg = Math.max(1, Math.round((Date.now() - recState.inicio) / 1000));
      const chunks = recState.chunks.slice();
      const tipoFinal = recorder.mimeType || mimeType || 'audio/mp4';

      try { stream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
      $('composer-' + tab).classList.remove('recording');
      $('rec-slide-' + tab).classList.remove('cancel-warn');
      $('rec-slide-' + tab).textContent = '◀ Deslize para cancelar';
      clearInterval(recState.timerInt);
      recState.ativo = false;

      if (foiCancelado) {
        toast('Áudio cancelado');
        return;
      }
      if (duracaoSeg < 1 || !chunks.length) {
        toast('Segure o botão para gravar áudio');
        return;
      }

      const blob = new Blob(chunks, { type: tipoFinal });
      const reader = new FileReader();
      reader.onload = ev => {
        const payload = {
          sender: eu,
          tipo: 'audio',
          conteudo: ev.target.result,
          duracao: duracaoSeg,
          timestamp: serverTimestamp()
        };
        if (respondendo) {
          payload.replyTo = respondendo.texto;
          payload.replyId = respondendo.chave;
        }
        push(ref(db, PATH[tab]), payload);
        cancelarResposta();
        vibrar(15);
        toast('Áudio enviado');
      };
      reader.readAsDataURL(blob);
    };

    recorder.start(200);
  } catch (err) {
    recState.ativo = false;
    toast('Permita o acesso ao microfone para gravar');
  }
}

function finalizarGravacao() {
  if (!recState.ativo) return;
  clearInterval(recState.timerInt);
  try {
    if (recState.recorder && recState.recorder.state !== 'inactive') {
      recState.recorder.stop();
    } else {
      cancelarGravacao();
    }
  } catch (e) {
    cancelarGravacao();
  }
}

/* ---------- envio de texto e eventos do botão ação ---------- */
function enviar(tab) {
  const input = $('input-' + tab);
  const texto = input.value.trim(); if (!texto) return;

  if (editando && editando.tab === tab) {
    update(ref(db, `${PATH[tab]}/${editando.chave}`), { conteudo: texto, edited: true });
    input.value = '';
    cancelarResposta();
    stopTyping();
    toast('Mensagem editada');
    return;
  }

  const payload = { sender: eu, tipo: 'texto', conteudo: texto, timestamp: serverTimestamp() };
  if (respondendo) {
    payload.replyTo = respondendo.texto;
    payload.replyId = respondendo.chave;
  }
  push(ref(db, PATH[tab]), payload);
  input.value = ''; cancelarResposta(); stopTyping();
  atualizarBotaoAcao(tab);
  input.focus();
}

['chat', 'secreto'].forEach(t => {
  const btn = $('action-' + t);
  const inp = $('input-' + t);

  btn.addEventListener('pointerdown', e => {
    if (inp.value.trim().length > 0) {
      e.preventDefault();
      enviar(t);
      return;
    }
    e.preventDefault();
    iniciarGravacao(t, e.clientX);
  });

  btn.addEventListener('pointermove', e => {
    if (!recState.ativo || recState.tab !== t) return;
    const dx = e.clientX - recState.startX;
    const slide = $('rec-slide-' + t);
    if (dx < -65) {
      slide.textContent = 'Solte para cancelar ✕';
      slide.classList.add('cancel-warn');
      recState.cancelado = true;
    } else {
      slide.textContent = '◀ Deslize para cancelar';
      slide.classList.remove('cancel-warn');
      recState.cancelado = false;
    }
  });

  const soltar = () => {
    if (!recState.ativo || recState.tab !== t) return;
    if (recState.cancelado) cancelarGravacao();
    else finalizarGravacao();
  };
  btn.addEventListener('pointerup', soltar);
  btn.addEventListener('pointercancel', soltar);

  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); enviar(t); } });
  inp.addEventListener('focus', () => fecharTodasBandejas());
  inp.addEventListener('input', () => {
    atualizarBotaoAcao(t);
    onTyping();
  });

  inp.addEventListener('paste', e => {
    const items = (e.clipboardData || window.clipboardData)?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        e.preventDefault();
        const blob = item.getAsFile();
        if (blob) enviarArquivoComoFigurinha(blob, t);
        return;
      }
    }
  });
});

let typing = false, typingT = null;
function onTyping() {
  if (!typing) { typing = true; update(R.meu, { typing: true }); }
  clearTimeout(typingT); typingT = setTimeout(stopTyping, 2500);
}
function stopTyping() {
  clearTimeout(typingT);
  if (typing) { typing = false; if (R.meu) update(R.meu, { typing: false }); }
}

/* ---------- fotos e figurinhas do iPhone + bandeja ---------- */
document.querySelectorAll('[data-attach]').forEach(b => b.addEventListener('click', () => {
  fecharTodasBandejas();
  if (b.dataset.attach === 'secreto') toast('A foto será de visualização única');
  $('file-' + b.dataset.attach).click();
}));

document.querySelectorAll('[data-sticker]').forEach(b => b.addEventListener('click', () => {
  toggleStickerTray(b.dataset.sticker);
}));
document.querySelectorAll('[data-tray-close]').forEach(b => b.addEventListener('click', fecharTodasBandejas));

document.querySelectorAll('[data-tray-paste]').forEach(b => b.addEventListener('click', async () => {
  const tab = b.dataset.trayPaste;
  if (navigator.clipboard && navigator.clipboard.read) {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        const imgType = item.types.find(tp => tp.startsWith('image/'));
        if (imgType) {
          const blob = await item.getType(imgType);
          enviarArquivoComoFigurinha(blob, tab);
          return;
        }
      }
      toast('Nenhuma figurinha copiada na memória');
      return;
    } catch (err) {}
  }
  toast('Toque no campo de mensagem e escolha "Colar"');
  fecharTodasBandejas();
  $('input-' + tab).focus();
}));

document.querySelectorAll('[data-tray-pick]').forEach(b => b.addEventListener('click', () => {
  $('sticker-file-' + b.dataset.trayPick).click();
}));

['chat', 'secreto'].forEach(t => {
  $('file-' + t).addEventListener('change', e => processarImagem(e, t));
  $('sticker-file-' + t).addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) enviarArquivoComoFigurinha(file, t);
    e.target.value = '';
  });
});

function enviarFigurinhaDataUrl(dataUrl, tab) {
  const payload = { sender: eu, tipo: 'figurinha', conteudo: dataUrl, timestamp: serverTimestamp() };
  if (respondendo) {
    payload.replyTo = respondendo.texto;
    payload.replyId = respondendo.chave;
  }
  push(ref(db, PATH[tab]), payload);
  if (tab === 'chat') saveRecentSticker(dataUrl);
  cancelarResposta();
  fecharTodasBandejas();
  vibrar(15);
}

function enviarArquivoComoFigurinha(fileOrBlob, tab) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 380;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
      else { if (h > MAX) { w *= MAX / h; h = MAX; } }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      let dataUrl = c.toDataURL('image/webp', 0.82);
      if (!dataUrl.startsWith('data:image/webp')) {
        dataUrl = c.toDataURL('image/png');
      }
      enviarFigurinhaDataUrl(dataUrl, tab);
      toast('Figurinha enviada');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(fileOrBlob);
}

function processarImagem(ev, tab) {
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 900; let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = c.toDataURL('image/jpeg', 0.65);
      const payload = { sender: eu, tipo: tab === 'secreto' ? 'imagem_unica' : 'imagem', conteudo: b64, timestamp: serverTimestamp() };
      if (tab === 'secreto') payload.aberta = false;
      if (respondendo) {
        payload.replyTo = respondendo.texto;
        payload.replyId = respondendo.chave;
      }
      push(ref(db, PATH[tab]), payload);
      cancelarResposta();
      toast(tab === 'secreto' ? 'Foto enviada · visualização única' : 'Foto enviada');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  ev.target.value = '';
}

function abrirViewer(src, titulo) {
  $('viewer-img').src = src; $('viewer-title').textContent = titulo || '';
  $('viewer').classList.add('show');
}
function fecharViewer() { $('viewer').classList.remove('show'); $('viewer-img').src = ''; }
$('viewer-close').addEventListener('click', fecharViewer);
$('viewer').addEventListener('click', e => { if (e.target.id === 'viewer') fecharViewer(); });

const abrindo = new Set();
async function abrirFotoUnica(m) {
  if (abrindo.has(m.chave) || !m.conteudo) return;
  abrindo.add(m.chave);
  const src = m.conteudo;
  abrirViewer(src, 'Visualização única · some ao fechar');
  try { await update(ref(db, `chat_secreto/${m.chave}`), { aberta: true, conteudo: null }); }
  catch (err) { console.warn('Erro ao apagar a foto do servidor', err); }
}

/* ---------- apagar secreto ---------- */
$('btn-burn').addEventListener('click', async () => {
  if (!confirm('Apagar todas as mensagens secretas para os dois?')) return;
  await set(ref(db, PATH.secreto), null);
  vibrar([20, 40, 20]); toast('Conversa secreta apagada');
  mudarAba('chat');
});

/* ---------- emojis ---------- */
function emojiFlutuante(emoji) {
  const e = el('div', 'floating-emoji', emoji);
  e.style.left = (15 + Math.random() * 65) + '%';
  document.body.appendChild(e); setTimeout(() => e.remove(), 3100);
}
$('quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  set(R.emojiMeu, { icon: b.dataset.e, time: serverTimestamp() });
  emojiFlutuante(b.dataset.e); vibrar(10);
});
