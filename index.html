<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#09090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Espaço">
<meta name="robots" content="noindex,nofollow">
<title>Nosso Espaço</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --bg:#09090c; --panel:#131318; --panel2:#1b1b23;
  --primary:#ff3b5c; --primary2:#d11a42; --fire:#ff8a1f;
  --text:#f2f2f5; --muted:#8b8b97;
  --glass:rgba(19,19,24,.72); --line:rgba(255,255,255,.07);
  --sec-bg:#050408; --sec:#a21fff; --sec2:#6c0fc0;
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{position:fixed;inset:0;height:var(--vh,100dvh);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column}
button{font-family:inherit}

/* ===== Escudo de privacidade (troca de app) ===== */
#shield{position:fixed;inset:0;z-index:99999;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);font-size:14px}
#shield.show{display:flex}
#shield i{font-size:34px;color:var(--primary)}

/* ===== Login ===== */
#login{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px calc(24px) calc(24px + var(--sab));
  background:radial-gradient(120% 70% at 50% 0%,#3a0a18 0%,#12060b 45%,var(--bg) 80%)}
#login.hide{display:none}
.lock-icon{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:26px;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 10px 40px rgba(255,59,92,.35);margin-bottom:22px}
#login h1{font-size:20px;font-weight:600;margin:0 0 6px}
#login p{font-size:13px;color:var(--muted);margin:0 0 28px}
.dots{display:flex;gap:16px;margin-bottom:34px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);transition:.15s}
.dot.on{background:var(--primary);border-color:var(--primary);box-shadow:0 0 14px rgba(255,59,92,.7);transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
.key{height:76px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-size:26px;font-weight:400;cursor:pointer;display:grid;place-items:center;transition:.12s;backdrop-filter:blur(8px)}
.key:active{background:rgba(255,59,92,.25);transform:scale(.92)}
.key.ghost{background:none;border:none;pointer-events:none}
.key.del{font-size:20px;color:var(--muted)}

/* ===== App ===== */
#app{display:none;flex-direction:column;flex:1;min-height:0}
.app-header{padding:calc(12px + var(--sat)) 16px 12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:10}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2b1018,#1a0a10);border:1px solid rgba(255,59,92,.35);position:relative;flex-shrink:0}
.avatar .pres{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#555;border:2px solid var(--bg)}
.avatar .pres.on{background:#25e07a;box-shadow:0 0 8px #25e07a}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px;font-weight:600}
.who span{display:block;font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span.online{color:#25e07a}
.who span.typing{color:var(--primary)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.05);color:var(--muted);font-size:15px;cursor:pointer;transition:.15s}
.icon-btn:active{transform:scale(.88);background:rgba(255,255,255,.1)}

.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.active{display:flex}

/* ===== Sintonia ===== */
#view-sintonia{align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
  background:radial-gradient(70% 50% at 50% 42%,var(--aura,rgba(255,255,255,.04)) 0%,transparent 70%)}
#view-sintonia[data-s=beating]{--aura:rgba(255,59,92,.22)}
#view-sintonia[data-s=sync]{--aura:rgba(255,120,30,.25)}
#view-sintonia[data-s=waiting]{--aura:rgba(255,59,92,.1)}
.heart-stage{position:relative;width:230px;height:230px;display:grid;place-items:center;cursor:pointer}
.ring{position:absolute;inset:25px;border-radius:50%;border:2px solid var(--primary);opacity:0}
.heart-svg{width:150px;height:150px;overflow:visible;transition:transform .2s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:2}
.heart-svg path{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.4);stroke-width:.7;transition:fill .5s,stroke .5s,filter .5s}
.heart-stage:active .heart-svg{transform:scale(.9)}
[data-s=waiting] .heart-svg path{fill:rgba(255,59,92,.28);stroke:var(--primary);filter:drop-shadow(0 0 10px rgba(255,59,92,.5))}
[data-s=beating] .heart-svg{animation:beat 1.05s ease-in-out infinite}
[data-s=beating] .heart-svg path{fill:url(#gRed);stroke:#ff8aa0;stroke-width:.4;filter:drop-shadow(0 0 22px rgba(255,59,92,.8))}
[data-s=beating] .ring{animation:ring 2.1s ease-out infinite}
[data-s=beating] .ring:nth-child(2){animation-delay:1.05s}
[data-s=sync] .heart-svg{animation:fire 1.3s ease-in-out infinite alternate}
[data-s=sync] .heart-svg path{fill:url(#gFire);stroke:#ffc26b;stroke-width:.4}
[data-s=sync] .ring{border-color:var(--fire);animation:ring 2.6s ease-out infinite}
[data-s=sync] .ring:nth-child(2){animation-delay:1.3s}
@keyframes beat{0%,100%{transform:scale(.94)}15%{transform:scale(1.12)}30%{transform:scale(.98)}45%{transform:scale(1.1)}}
@keyframes fire{0%{transform:scale(1);filter:drop-shadow(0 0 18px rgba(255,120,0,.5))}100%{transform:scale(1.08);filter:drop-shadow(0 0 46px rgba(255,60,0,.95))}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.75);opacity:0}}
.sint-text{margin-top:26px;text-align:center;min-height:84px;padding:0 10px}
.sint-text strong{display:block;font-size:19px;font-weight:600;margin-bottom:6px}
.sint-text span{font-size:14px;color:var(--muted);line-height:1.5}
.hint-chip{margin-top:6px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:8px 14px;border-radius:20px}
.hint-chip b{color:var(--text);font-weight:600}
.stats{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:26px;font-size:12px;color:var(--muted)}
.stats b{color:var(--text);font-size:15px;margin-right:4px}
.mini-heart{position:fixed;pointer-events:none;z-index:60;font-size:22px;animation:miniUp var(--d,2s) ease-out forwards}
@keyframes miniUp{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x,0),-260px) scale(1.2) rotate(var(--r,0deg))}}

/* ===== Chat ===== */
.messages{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:3px;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
.day{align-self:center;font-size:11px;color:var(--muted);background:rgba(255,255,255,.05);padding:4px 12px;border-radius:12px;margin:12px 0 8px;font-weight:500}
.mw{display:flex;flex-direction:column;max-width:82%}
.mw.mine{align-self:flex-end;align-items:flex-end}
.mw.theirs{align-self:flex-start;align-items:flex-start}
.mw.first{margin-top:7px}
.bubble{padding:8px 12px 6px;border-radius:18px;font-size:15px;line-height:1.38;word-break:break-word;white-space:pre-wrap;position:relative;animation:pop .22s ease-out;-webkit-user-select:none}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.mine .bubble{background:linear-gradient(135deg,#ff3b5c,#e0204a);color:#fff;border-bottom-right-radius:5px}
.theirs .bubble{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}
.mine.grouped .bubble{border-top-right-radius:7px}
.theirs.grouped .bubble{border-top-left-radius:7px}
.bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:10px;opacity:.65;margin-top:2px;white-space:normal}
.bubble .meta .read{color:#8de3ff;opacity:1}
.bubble.bare{background:none!important;border:none!important;padding:0}
.bubble.bare .meta{padding:3px 4px 0}
.bubble img{display:block;width:210px;max-width:100%;height:auto;max-height:280px;object-fit:cover;border-radius:14px}
.reply-ref{display:block;background:rgba(0,0,0,.22);border-left:3px solid rgba(255,255,255,.55);border-radius:8px;padding:5px 9px;margin-bottom:5px;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;padding:30px}
.empty i{display:block;font-size:30px;margin-bottom:10px;color:var(--primary);opacity:.8}

.quick{display:flex;gap:8px;padding:6px 12px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:20px;padding:5px 13px;font-size:20px;cursor:pointer;transition:.12s}
.quick button:active{transform:scale(.8)}
.reply-bar{display:none;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.reply-bar i.l{color:var(--primary)}
.reply-bar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text)}
.reply-bar .x{padding:6px;cursor:pointer}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 10px;background:var(--bg);border-top:1px solid var(--line)}
.composer input[type=text]{flex:1;min-width:0;padding:12px 16px;border-radius:22px;background:var(--panel);color:var(--text);border:1px solid var(--line);font-size:16px;font-family:inherit;outline:none;-webkit-user-select:text;user-select:text;transition:.2s}
.composer input[type=text]:focus{border-color:rgba(255,59,92,.5)}
.round{width:44px;height:44px;border-radius:50%;border:none;display:grid;place-items:center;font-size:17px;cursor:pointer;flex-shrink:0;transition:.15s}
.round:active{transform:scale(.88)}
.round.attach{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.round.send{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 16px rgba(255,59,92,.35)}

/* ===== Secreto ===== */
#view-secreto{background:var(--sec-bg)}
#view-secreto .mine .bubble{background:linear-gradient(135deg,var(--sec),var(--sec2))}
#view-secreto .theirs .bubble{background:#150a24;border-color:rgba(162,31,255,.22)}
#view-secreto .composer,#view-secreto .quick{background:var(--sec-bg)}
#view-secreto .composer input[type=text]{background:#120a1d;border-color:rgba(162,31,255,.2)}
#view-secreto .composer input[type=text]:focus{border-color:rgba(162,31,255,.7)}
#view-secreto .round.send{background:linear-gradient(135deg,var(--sec),var(--sec2));box-shadow:0 4px 16px rgba(162,31,255,.4)}
#view-secreto .round.attach{background:#120a1d;color:var(--sec);border-color:rgba(162,31,255,.25)}
#view-secreto .reply-bar{background:#100818}
#view-secreto .reply-bar i.l{color:var(--sec)}
#view-secreto .day{background:rgba(162,31,255,.1);color:#b98aff}
#view-secreto .empty i{color:var(--sec)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:rgba(162,31,255,.09);border-bottom:1px solid rgba(162,31,255,.16);color:#c08bff;font-size:12px;font-weight:600}
.sec-head .l{display:flex;align-items:center;gap:8px}
.burn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--sec);color:var(--sec);border-radius:14px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer}
.burn:active{background:rgba(162,31,255,.2);transform:scale(.95)}
.once{width:200px;height:170px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  background:linear-gradient(135deg,rgba(162,31,255,.2),rgba(162,31,255,.05));border:1.5px dashed rgba(162,31,255,.5);transition:.2s}
.once:active{transform:scale(.96)}
.once i{font-size:32px;color:var(--sec)}
.once span{font-size:12px;color:#b9a3d6;text-align:center;padding:0 12px;line-height:1.4}
.once.opened{opacity:.45;border-style:solid;border-color:rgba(255,255,255,.08);background:rgba(0,0,0,.3);cursor:default}
.once.opened i{color:#666}

/* ===== Nav ===== */
.nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--sab))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;padding:4px 0;cursor:pointer;position:relative;transition:.2s}
.nav-item i{font-size:20px;transition:.2s}
.nav-item.active{color:var(--primary)}
.nav-item.active i{transform:translateY(-1px) scale(1.08)}
.nav-item.active.sec{color:var(--sec)}
.badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--panel);box-sizing:content-box}
.badge.sec{background:var(--sec)}
.badge.show{display:flex}
.badge.dot{min-width:9px;height:9px;padding:0;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* ===== Viewer ===== */
#viewer{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#viewer.show{display:flex}
#viewer img{max-width:96%;max-height:80%;border-radius:12px;object-fit:contain}
#viewer .vt{position:absolute;top:calc(18px + var(--sat));left:0;right:0;text-align:center;font-size:12px;color:#c08bff;font-weight:600}
#viewer .vx{position:absolute;top:calc(12px + var(--sat));right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:20px}

.floating-emoji{position:fixed;bottom:130px;font-size:40px;pointer-events:none;z-index:70;animation:floatUp 3s cubic-bezier(.25,1,.5,1) forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(20px) scale(.5)}20%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:translateY(-420px) scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(110px + var(--sab));transform:translate(-50%,10px);background:rgba(30,30,38,.95);border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:10000;opacity:0;transition:.3s;pointer-events:none;max-width:88%;text-align:center;backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="shield"><i class="fa-solid fa-lock"></i><span>Nosso Espaço</span></div>

<div id="viewer">
  <div class="vt" id="viewer-title"></div>
  <button class="vx" id="viewer-close"><i class="fa-solid fa-xmark"></i></button>
  <img id="viewer-img" alt="">
</div>
<div id="toast"></div>

<!-- Gradientes do coração -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b85"/><stop offset="1" stop-color="#e01a45"/></linearGradient>
    <linearGradient id="gFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff5a1f"/><stop offset="1" stop-color="#e0113e"/></linearGradient>
  </defs>
</svg>

<div id="login">
  <div class="lock-icon"><i class="fa-solid fa-heart"></i></div>
  <h1>Nosso Espaço</h1>
  <p>Digite o seu código</p>
  <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="keypad" id="keypad"></div>
</div>

<div id="app">
  <div class="app-header">
    <div class="avatar">💗<span class="pres" id="pres"></span></div>
    <div class="who"><b id="partner-name">Conectando...</b><span id="partner-status">Buscando sinal</span></div>
    <button class="icon-btn" id="btn-lock" title="Bloquear"><i class="fa-solid fa-lock"></i></button>
  </div>

  <div id="view-sintonia" class="view active" data-s="idle">
    <div class="heart-stage" id="heart-btn">
      <div class="ring"></div><div class="ring"></div>
      <svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <div class="sint-text"><strong id="sint-title">Verificando...</strong><span id="sint-sub"></span></div>
    <div class="hint-chip" id="sint-hint"></div>
    <div class="stats"><div><b id="st-sent">0</b>enviados</div><div><b id="st-recv">0</b>recebidos</div></div>
  </div>

  <div id="view-chat" class="view">
    <div class="messages" id="messages-chat"></div>
    <div class="quick" id="quick">
      <button data-e="🥺">🥺</button><button data-e="😍">😍</button><button data-e="😘">😘</button><button data-e="💞">💞</button><button data-e="🔥">🔥</button><button data-e="🥰">🥰</button><button data-e="😈">😈</button>
    </div>
    <div class="reply-bar" id="reply-chat"><i class="fa-solid fa-reply l"></i><span></span><i class="fa-solid fa-xmark x"></i></div>
    <div class="composer">
      <button class="round attach" data-attach="chat"><i class="fa-solid fa-camera"></i></button>
      <input type="text" id="input-chat" placeholder="Mensagem" enterkeyhint="send" autocomplete="off" autocorrect="on">
      <button class="round send" data-send="chat"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <div id="view-secreto" class="view">
    <div class="sec-head">
      <div class="l"><i class="fa-solid fa-user-secret"></i> Modo privado</div>
      <button class="burn" id="btn-burn"><i class="fa-solid fa-fire"></i> Apagar tudo</button>
    </div>
    <div class="messages" id="messages-secreto"></div>
    <div class="reply-bar" id="reply-secreto"><i class="fa-solid fa-reply l"></i><span></span><i class="fa-solid fa-xmark x"></i></div>
    <div class="composer">
      <button class="round attach" data-attach="secreto" title="Foto de visualização única"><i class="fa-solid fa-camera"></i></button>
      <input type="text" id="input-secreto" placeholder="Mensagem secreta" enterkeyhint="send" autocomplete="off">
      <button class="round send" data-send="secreto"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <input type="file" id="file-chat" accept="image/*" hidden>
  <input type="file" id="file-secreto" accept="image/*" hidden>

  <div class="nav">
    <div class="nav-item active" data-tab="sintonia"><i class="fa-solid fa-heart-pulse"></i><span>Sintonia</span><b class="badge dot" id="bd-sintonia"></b></div>
    <div class="nav-item" data-tab="chat"><i class="fa-solid fa-comment-dots"></i><span>Chat</span><b class="badge" id="bd-chat"></b></div>
    <div class="nav-item" data-tab="secreto"><i class="fa-solid fa-mask"></i><span>Secreto</span><b class="badge sec" id="bd-secreto"></b></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, update, remove, onDisconnect, serverTimestamp, increment, query, limitToLast } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD15BizvlLZEvZPi4VJDOJ-aI7t1lcNQi4",
  authDomain: "nosso-coracao.firebaseapp.com",
  databaseURL: "https://nosso-coracao-default-rtdb.firebaseio.com",
  projectId: "nosso-coracao",
  storageBucket: "nosso-coracao.firebasestorage.app",
  messagingSenderId: "560106544356",
  appId: "1:560106544356:web:25926da1705d98941da0f1"
};
const db = getDatabase(initializeApp(firebaseConfig));

const $ = id => document.getElementById(id);
const NOME_PARCEIRO = 'Coração';
const PINS = { '1509': ['user_a', 'user_b'], '1507': ['user_b', 'user_a'] };
const LOCK_AFTER_MS = 60000;           // bloqueia sozinho se ficar 1 min fora do app
const PATH = { chat: 'chat', secreto: 'chat_secreto' };

let eu = '', outro = '';
let R = {};                                // refs de status/emoji
let appReady = false, locked = true;
let meu = { state: 'idle', online: false };
let par = { state: 'idle', online: false };
let aba = 'sintonia';
let respondendo = null;
let hiddenAt = 0;
const cache = { chat: [], secreto: [] };
const lastReadSeen = { chat: 0, secreto: 0 };

/* ---------- altura real com teclado (iOS/Android) ---------- */
const vv = window.visualViewport;
function fitViewport() {
  document.documentElement.style.setProperty('--vh', (vv ? vv.height : innerHeight) + 'px');
  window.scrollTo(0, 0);
  if (aba !== 'sintonia') scrollBottom(aba, true);
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }
window.addEventListener('resize', fitViewport);
fitViewport();

/* ---------- utilidades ---------- */
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
const vibrar = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function diaLabel(ts) {
  const d = new Date(ts), h = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(h.getFullYear(), h.getMonth(), h.getDate());
  const diff = Math.round((b - a) / 86400000);
  if (diff === 0) return 'Hoje';
  if (diff === 1) return 'Ontem';
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
}
function visto(ts) {
  if (!ts) return 'offline';
  const d = new Date(ts), h = new Date();
  const hoje = d.toDateString() === h.toDateString();
  return hoje ? `visto hoje às ${hhmm(ts)}` : `visto ${diaLabel(ts).toLowerCase()} às ${hhmm(ts)}`;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ---------- login com teclado numérico ---------- */
let pin = '';
const keypad = $('keypad');
['1','2','3','4','5','6','7','8','9','','0','del'].forEach(k => {
  const b = el('button', 'key' + (k === '' ? ' ghost' : '') + (k === 'del' ? ' del' : ''));
  if (k === 'del') b.innerHTML = '<i class="fa-solid fa-delete-left"></i>'; else b.textContent = k;
  b.dataset.k = k; keypad.appendChild(b);
});
function dots() { document.querySelectorAll('#dots .dot').forEach((d, i) => d.classList.toggle('on', i < pin.length)); }
keypad.addEventListener('click', e => {
  const b = e.target.closest('.key'); if (!b || b.classList.contains('ghost')) return;
  vibrar(8);
  if (b.dataset.k === 'del') pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += b.dataset.k;
  dots();
  if (pin.length === 4) setTimeout(verificarPin, 140);
});
function verificarPin() {
  const par_ = PINS[pin];
  if (!par_) {
    const d = $('dots'); d.classList.add('shake'); vibrar([40, 40, 40]);
    setTimeout(() => { d.classList.remove('shake'); pin = ''; dots(); }, 420);
    return;
  }
  if (appReady && par_[0] !== eu) { location.reload(); return; }
  pin = ''; dots();
  if (!appReady) inicializar(par_[0], par_[1]); else desbloquear();
}

/* ---------- bloqueio ---------- */
function bloquear() {
  if (!appReady) return;
  locked = true; stopTyping();
  $('login').classList.remove('hide');
  $('app').style.display = 'none';
  setPresenca(false);
}
function desbloquear() {
  locked = false;
  $('login').classList.add('hide');
  $('app').style.display = 'flex';
  setPresenca(true); fitViewport(); marcarLido();
}
$('btn-lock').addEventListener('click', bloquear);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    $('shield').classList.add('show'); hiddenAt = Date.now();
    if (appReady && !locked) setPresenca(false);
  } else {
    $('shield').classList.remove('show');
    if (appReady && !locked) {
      if (Date.now() - hiddenAt > LOCK_AFTER_MS) bloquear();
      else { setPresenca(true); marcarLido(); }
    }
  }
});
window.addEventListener('pagehide', () => { $('shield').classList.add('show'); if (appReady && !locked) setPresenca(false); });

/* ---------- inicialização ---------- */
function inicializar(a, b) {
  eu = a; outro = b; appReady = true; locked = false;
  R.meu = ref(db, `status_users/${eu}`);
  R.par = ref(db, `status_users/${outro}`);
  R.emojiMeu = ref(db, `emoji/${eu}`);
  R.emojiPar = ref(db, `emoji/${outro}`);
  $('partner-name').textContent = NOME_PARCEIRO;
  $('login').classList.add('hide');
  $('app').style.display = 'flex';

  onValue(ref(db, '.info/connected'), s => {
    if (s.val() === true) {
      onDisconnect(R.meu).update({ online: false, last_seen: serverTimestamp(), typing: false });
      if (!document.hidden && !locked) update(R.meu, { online: true });
    }
  });
  onValue(R.meu, s => { meu = s.val() || { state: 'idle' }; atualizarSintonia(); atualizarBadges(); marcarLido(); });
  onValue(R.par, s => {
    par = s.val() || { state: 'idle' };
    atualizarSintonia(); atualizarBadges();
    ['chat', 'secreto'].forEach(t => { const r = par['read_' + t] || 0; if (r !== lastReadSeen[t]) { lastReadSeen[t] = r; renderTab(t); } });
  });

  let primeiroEmoji = true, ultimoEmoji = null;
  onValue(R.emojiPar, s => {
    const d = s.val();
    if (primeiroEmoji) { primeiroEmoji = false; ultimoEmoji = d && d.time; return; }
    if (d && d.time !== ultimoEmoji) { ultimoEmoji = d.time; emojiFlutuante(d.icon); vibrar(25); }
  });

  ['chat', 'secreto'].forEach(t => {
    onValue(query(ref(db, PATH[t]), limitToLast(100)), snap => {
      const arr = [];
      snap.forEach(c => { arr.push({ chave: c.key, ...c.val() }); });
      arr.sort((x, y) => (x.timestamp || 0) - (y.timestamp || 0));
      cache[t] = arr; renderTab(t); atualizarBadges(); marcarLido();
    });
  });
  atualizarSintonia();
}

function setPresenca(on) {
  if (!R.meu) return;
  update(R.meu, on ? { online: true } : { online: false, last_seen: serverTimestamp(), typing: false });
}

/* ---------- sintonia (coração) ---------- */
let vistoTimer = null, ultimoPulsoVibrado = 0;
function setHeart(s, title, sub, hint) {
  $('view-sintonia').dataset.s = s;
  $('sint-title').textContent = title;
  $('sint-sub').textContent = sub || '';
  $('sint-hint').innerHTML = hint || '';
  $('sint-hint').style.display = hint ? 'block' : 'none';
}
function atualizarSintonia() {
  if (!appReady) return;
  // cabeçalho
  const st = $('partner-status'); st.className = '';
  if (par.online && par.typing) { st.textContent = 'digitando…'; st.classList.add('typing'); }
  else if (par.online) { st.textContent = 'online'; st.classList.add('online'); }
  else st.textContent = visto(par.last_seen);
  $('pres').classList.toggle('on', !!par.online);
  $('st-sent').textContent = meu.enviados || 0;
  $('st-recv').textContent = par.enviados || 0;

  const ambosOnline = meu.online && par.online;
  if (meu.state === 'visto') {
    setHeart('sync', `${NOME_PARCEIRO} sentiu o seu coração`, 'Ela sentiu que você pensou nela 🥰');
    if (!vistoTimer) vistoTimer = setTimeout(() => { vistoTimer = null; update(R.meu, { state: 'idle' }); }, 5000);
    return;
  }
  if (par.state === 'pensando') {
    setHeart('beating', `${NOME_PARCEIRO} pensou em você`, 'O coração dela está batendo por aqui.', 'Toque <b>2x</b> para avisar que sentiu');
    const t = par.time || 1;
    if (t !== ultimoPulsoVibrado) { ultimoPulsoVibrado = t; vibrar([60, 80, 60, 80, 120]); }
    return;
  }
  if (meu.state === 'pensando') {
    setHeart('waiting', 'Coração enviado', `Aguardando ${NOME_PARCEIRO} abrir e sentir...`);
    return;
  }
  if (ambosOnline) {
    setHeart('sync', 'Conexão sincronizada', 'Vocês estão aqui ao mesmo tempo.', 'Toque <b>1x</b> para mandar um coração');
    return;
  }
  setHeart('idle', 'Modo de espera', `${NOME_PARCEIRO} está offline agora.`, 'Toque <b>1x</b> para deixar um coração');
}

function chuvaCoracoes(n = 8) {
  const r = $('heart-btn').getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const h = el('div', 'mini-heart', ['❤️', '💗', '💖', '💕'][i % 4]);
    h.style.left = (r.left + r.width / 2 + (Math.random() * 80 - 40)) + 'px';
    h.style.top = (r.top + r.height / 2) + 'px';
    h.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
    h.style.setProperty('--r', (Math.random() * 50 - 25) + 'deg');
    h.style.setProperty('--d', (1.6 + Math.random()) + 's');
    h.style.animationDelay = (i * 0.07) + 's';
    document.body.appendChild(h); setTimeout(() => h.remove(), 3200);
  }
}
let lastTap = 0, tapT = null;
$('heart-btn').addEventListener('click', () => {
  const now = Date.now();
  if (now - lastTap < 350) { clearTimeout(tapT); lastTap = 0; toqueDuplo(); }
  else { lastTap = now; tapT = setTimeout(toqueUnico, 350); }
});
function toqueUnico() {
  if (par.state === 'pensando') { toast('Toque 2x para avisar que sentiu 💗'); return; }
  if (meu.state === 'pensando') { toast('Seu coração já foi enviado, aguarde 💌'); return; }
  if (meu.state === 'visto') return;
  update(R.meu, { state: 'pensando', time: serverTimestamp(), enviados: increment(1) });
  vibrar([30, 50, 30]); chuvaCoracoes(7);
}
function toqueDuplo() {
  if (par.state === 'pensando') {
    update(R.par, { state: 'visto', time: serverTimestamp() });
    vibrar([40, 60, 40, 60, 150]); chuvaCoracoes(12);
    toast('Ela vai saber que você sentiu 🥰');
  } else toast('Toque 1x para mandar um coração');
}

/* ---------- abas ---------- */
document.querySelector('.nav').addEventListener('click', e => {
  const it = e.target.closest('.nav-item'); if (it) mudarAba(it.dataset.tab);
});
function mudarAba(a) {
  aba = a; cancelarResposta();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('view-' + a).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.tab === a);
    n.classList.toggle('sec', n.dataset.tab === 'secreto');
  });
  if (a !== 'sintonia') scrollBottom(a, true);
  marcarLido(); atualizarBadges();
}

/* ---------- lidas / badges ---------- */
function marcarLido() {
  if (!appReady || locked || document.hidden || aba === 'sintonia') return;
  const msgs = cache[aba];
  const ultimaDela = [...msgs].reverse().find(m => m.sender === outro);
  const lido = meu['read_' + aba] || 0;
  if (ultimaDela && (ultimaDela.timestamp || 0) > lido) update(R.meu, { ['read_' + aba]: serverTimestamp() });
}
function atualizarBadges() {
  ['chat', 'secreto'].forEach(t => {
    const lido = meu['read_' + t] || 0;
    const n = cache[t].filter(m => m.sender === outro && (m.timestamp || 0) > lido).length;
    const b = $('bd-' + t);
    const mostrar = n > 0 && aba !== t;
    b.textContent = n > 9 ? '9+' : n; b.classList.toggle('show', mostrar);
  });
  $('bd-sintonia').classList.toggle('show', par.state === 'pensando' && aba !== 'sintonia');
}

/* ---------- renderização do chat ---------- */
function scrollBottom(t, force) {
  const a = $('messages-' + t); if (!a) return;
  requestAnimationFrame(() => { a.scrollTop = a.scrollHeight; });
}
function pressionar(node, onTap, onLong) {
  let t = null, fired = false;
  node.addEventListener('pointerdown', () => { fired = false; if (onLong) t = setTimeout(() => { fired = true; vibrar(15); onLong(); }, 550); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => node.addEventListener(ev, () => clearTimeout(t)));
  node.addEventListener('contextmenu', e => e.preventDefault());
  node.addEventListener('click', () => { if (fired) { fired = false; return; } onTap && onTap(); });
}
function renderTab(tab) {
  const area = $('messages-' + tab);
  const msgs = cache[tab];
  const perto = area.scrollHeight - area.scrollTop - area.clientHeight < 140;
  const primeira = !area.dataset.ok; area.dataset.ok = '1';
  area.innerHTML = '';
  if (!msgs.length) {
    const e = el('div', 'empty');
    e.innerHTML = tab === 'secreto'
      ? '<i class="fa-solid fa-user-secret"></i>Aqui é só de vocês.<br>Fotos são de visualização única.'
      : '<i class="fa-solid fa-heart"></i>Nenhuma mensagem ainda.<br>Diga oi 💗';
    area.appendChild(e); return;
  }
  const leituraPar = par['read_' + tab] || 0;
  let diaAnt = '', senderAnt = null, tsAnt = 0;
  msgs.forEach(m => {
    const ts = m.timestamp || Date.now();
    const dia = new Date(ts).toDateString();
    if (dia !== diaAnt) { area.appendChild(el('div', 'day', diaLabel(ts))); diaAnt = dia; senderAnt = null; }
    const mine = m.sender === eu;
    const agrup = senderAnt === m.sender && (ts - tsAnt) < 120000;
    senderAnt = m.sender; tsAnt = ts;

    const w = el('div', 'mw ' + (mine ? 'mine' : 'theirs') + (agrup ? ' grouped' : ' first'));
    const b = el('div', 'bubble');
    if (m.replyTo) b.appendChild(el('span', 'reply-ref', m.replyTo));

    let resumo = m.conteudo;
    if (m.tipo === 'imagem') {
      b.classList.add('bare');
      const img = el('img'); img.src = m.conteudo; img.loading = 'lazy';
      img.addEventListener('click', ev => { ev.stopPropagation(); abrirViewer(m.conteudo, ''); });
      b.appendChild(img); resumo = '📷 Foto';
    } else if (m.tipo === 'imagem_unica') {
      b.classList.add('bare');
      const aberta = m.aberta === true || !m.conteudo;
      const box = el('div', 'once' + (aberta ? ' opened' : ''));
      const ic = el('i', 'fa-solid ' + (aberta ? 'fa-check-circle' : (mine ? 'fa-paper-plane' : 'fa-eye')));
      let txt;
      if (aberta) txt = 'Foto visualizada';
      else txt = mine ? 'Foto enviada\naguardando ver' : 'Toque para ver\nsó uma vez';
      const sp = el('span', null, txt); sp.style.whiteSpace = 'pre-line';
      box.append(ic, sp);
      if (!aberta && !mine) box.addEventListener('click', ev => { ev.stopPropagation(); abrirFotoUnica(m); });
      b.appendChild(box); resumo = '📷 Foto única';
    } else {
      b.appendChild(document.createTextNode(m.conteudo || ''));
    }

    const meta = el('div', 'meta');
    meta.appendChild(el('span', null, hhmm(ts)));
    if (mine) {
      const lido = leituraPar >= (m.timestamp || 0) && m.timestamp;
      const tick = el('i', 'fa-solid ' + (lido ? 'fa-check-double read' : 'fa-check') );
      tick.className += lido ? '' : '';
      meta.appendChild(tick);
    }
    b.appendChild(meta);

    pressionar(b,
      () => { if (m.tipo !== 'imagem_unica') iniciarResposta(resumo); },
      mine ? () => { if (confirm('Apagar esta mensagem para os dois?')) remove(ref(db, `${PATH[tab]}/${m.chave}`)); } : null
    );
    w.appendChild(b); area.appendChild(w);
  });
  if (primeira || perto || msgs[msgs.length - 1].sender === eu) scrollBottom(tab);
}

/* ---------- resposta ---------- */
function iniciarResposta(texto) {
  if (aba === 'sintonia') return;
  respondendo = texto;
  const rb = $('reply-' + aba); rb.style.display = 'flex';
  rb.querySelector('span').textContent = texto;
  $('input-' + aba).focus();
}
function cancelarResposta() {
  respondendo = null;
  $('reply-chat').style.display = 'none'; $('reply-secreto').style.display = 'none';
}
document.querySelectorAll('.reply-bar .x').forEach(x => x.addEventListener('click', cancelarResposta));

/* ---------- envio ---------- */
function enviar(tab) {
  const input = $('input-' + tab);
  const texto = input.value.trim(); if (!texto) return;
  const payload = { sender: eu, tipo: 'texto', conteudo: texto, timestamp: serverTimestamp() };
  if (respondendo) payload.replyTo = respondendo;
  push(ref(db, PATH[tab]), payload);
  input.value = ''; cancelarResposta(); stopTyping();
  input.focus();                         // mantém o teclado aberto
}
document.querySelectorAll('[data-send]').forEach(b => {
  b.addEventListener('pointerdown', e => e.preventDefault());   // não rouba o foco do input
  b.addEventListener('click', () => enviar(b.dataset.send));
});
['chat', 'secreto'].forEach(t => {
  const i = $('input-' + t);
  i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); enviar(t); } });
  i.addEventListener('input', onTyping);
});

let typing = false, typingT = null;
function onTyping() {
  if (!typing) { typing = true; update(R.meu, { typing: true }); }
  clearTimeout(typingT); typingT = setTimeout(stopTyping, 2500);
}
function stopTyping() {
  clearTimeout(typingT);
  if (typing) { typing = false; if (R.meu) update(R.meu, { typing: false }); }
}

/* ---------- fotos ---------- */
document.querySelectorAll('[data-attach]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.attach === 'secreto') toast('📸 A foto será de visualização única');
  $('file-' + b.dataset.attach).click();
}));
['chat', 'secreto'].forEach(t => $('file-' + t).addEventListener('change', e => processarImagem(e, t)));
function processarImagem(ev, tab) {
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 900; let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = c.toDataURL('image/jpeg', 0.65);
      const payload = { sender: eu, tipo: tab === 'secreto' ? 'imagem_unica' : 'imagem', conteudo: b64, timestamp: serverTimestamp() };
      if (tab === 'secreto') payload.aberta = false;
      push(ref(db, PATH[tab]), payload);
      toast(tab === 'secreto' ? '📸 Foto enviada · visualização única' : '📷 Foto enviada');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  ev.target.value = '';
}
function abrirViewer(src, titulo) {
  $('viewer-img').src = src; $('viewer-title').textContent = titulo || '';
  $('viewer').classList.add('show');
}
function fecharViewer() { $('viewer').classList.remove('show'); $('viewer-img').src = ''; }
$('viewer-close').addEventListener('click', fecharViewer);
$('viewer').addEventListener('click', e => { if (e.target.id === 'viewer') fecharViewer(); });

const abrindo = new Set();
async function abrirFotoUnica(m) {
  if (abrindo.has(m.chave) || !m.conteudo) return;
  abrindo.add(m.chave);
  const src = m.conteudo;
  abrirViewer(src, '👁️ Visualização única · some ao fechar');
  try { await update(ref(db, `chat_secreto/${m.chave}`), { aberta: true, conteudo: null }); }
  catch (err) { console.warn('Erro ao apagar a foto do servidor', err); }
}

/* ---------- apagar secreto ---------- */
$('btn-burn').addEventListener('click', async () => {
  if (!confirm('Apagar todas as mensagens secretas para os dois?')) return;
  await set(ref(db, PATH.secreto), null);
  vibrar([20, 40, 20]); toast('🔥 Conversa secreta apagada');
  mudarAba('chat');
});

/* ---------- emojis ---------- */
function emojiFlutuante(emoji) {
  const e = el('div', 'floating-emoji', emoji);
  e.style.left = (15 + Math.random() * 65) + '%';
  document.body.appendChild(e); setTimeout(() => e.remove(), 3100);
}
$('quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  set(R.emojiMeu, { icon: b.dataset.e, time: serverTimestamp() });
  emojiFlutuante(b.dataset.e); vibrar(10);
});
</script>
</body>
</html>
