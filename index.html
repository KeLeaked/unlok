<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Coração</title>
    <style>
        /* Ajuste no body para o teclado do celular não amassar a tela */
        body {
            margin: 0; padding: 0;
            background-color: #1a0000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center;
            min-height: 100vh; /* Permite rolar a tela se o teclado abrir */
            text-align: center;
            position: relative;
        }
        
        /* Container principal flexível */
        .container { 
            display: none; width: 100%; max-width: 400px; 
            padding: 15px; box-sizing: border-box; z-index: 10;
            flex-direction: column; flex: 1;
        }
        
        #login-screen { display: flex; justify-content: center; margin-top: 30vh; gap: 15px; }
        
        input.senha {
            padding: 15px; border-radius: 10px; border: none;
            font-size: 18px; text-align: center; background: #330000; color: white;
            width: 100%; box-sizing: border-box;
        }
        
        button.btn-entrar {
            padding: 15px; border-radius: 10px; border: none;
            background: #ff3333; color: white; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.2s; width: 100%;
        }
        button.btn-entrar:active { transform: scale(0.95); }
        
        /* CORAÇÃO E STATUS */
        .header-area { margin-top: 10px; flex-shrink: 0; }
        .heart-wrapper { height: 140px; display: flex; align-items: center; justify-content: center; margin: 10px 0; }
        .heart {
            font-size: 100px; cursor: pointer; transition: transform 0.2s;
            user-select: none; -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.2)); line-height: 1;
        }
        .heart.beating { animation: pulse 1s infinite alternate; filter: drop-shadow(0 0 30px rgba(255, 50, 0, 0.8)); }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
        
        .heart.glowing { animation: glow 1.5s infinite alternate; }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.5)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 105, 180, 1)); transform: scale(1.2); }
            100% { filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.5)); transform: scale(1); }
        }

        .status-text { font-size: 16px; min-height: 45px; color: #ff9999; }
        
        /* BARRA DE EMOJIS COMPACTA */
        .emoji-bar {
            display: flex; justify-content: center; gap: 15px;
            margin: 10px 0; padding: 10px;
            background: rgba(255, 255, 255, 0.05); border-radius: 20px;
        }
        .emoji-btn {
            background: none; border: none; font-size: 26px;
            padding: 0; cursor: pointer; transition: 0.2s;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .emoji-btn:active { transform: scale(0.7); }

        /* MINI CHAT (ESTILO WHATSAPP) */
        .chat-container {
            flex: 1; display: flex; flex-direction: column;
            background: rgba(0, 0, 0, 0.3); border-radius: 15px;
            overflow: hidden; margin-top: 5px;
            min-height: 200px; /* Garante tamanho no celular */
        }
        .messages {
            flex: 1; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .msg {
            padding: 8px 12px; border-radius: 15px; font-size: 14px;
            max-width: 85%; word-wrap: break-word; text-align: left;
        }
        .msg.mine { background: #ff3333; align-self: flex-end; border-bottom-right-radius: 3px; color: white; }
        .msg.theirs { background: #333333; align-self: flex-start; border-bottom-left-radius: 3px; color: white; }
        
        .chat-input-area { display: flex; background: rgba(0,0,0,0.5); padding: 8px; gap: 8px; }
        .chat-input-area input {
            flex: 1; padding: 10px 15px; border-radius: 20px; background: #222;
            color: white; border: none; font-size: 15px; outline: none;
        }
        .chat-input-area button {
            background: #ff3333; border: none; color: white; border-radius: 50%;
            width: 40px; height: 40px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 16px;
        }
        .chat-input-area button:active { transform: scale(0.9); }

        /* Emoji Flutuante */
        .floating-emoji {
            position: fixed; bottom: 100px;
            font-size: 40px; pointer-events: none; z-index: 50;
            animation: floatUp 3s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-400px) scale(1.5); }
        }
    </style>
</head>
<body>

    <!-- TELA 1: SENHA -->
    <div id="login-screen" class="container">
        <h2>Nosso Espaço</h2>
        <p style="color: #888; font-size: 14px; margin-top: -10px;">Digite sua senha</p>
        <input type="password" id="senha" class="senha" placeholder="Senha numérica" inputmode="numeric">
        <button class="btn-entrar" onclick="verificarSenha()">Entrar</button>
    </div>

    <!-- TELA 2: APP PRINCIPAL -->
    <div id="app-screen" class="container">
        
        <!-- Topo: Saudação, Coração e Status -->
        <div class="header-area">
            <h3 id="greeting" style="margin: 0;">...</h3>
            
            <div class="heart-wrapper">
                <div id="heart-btn" class="heart">❤️</div>
            </div>
            
            <div id="status" class="status-text">Conectando...</div>
        </div>
        
        <!-- Emojis Rápidos -->
        <div class="emoji-bar">
            <button class="emoji-btn" onclick="enviarEmoji('🥺')">🥺</button>
            <button class="emoji-btn" onclick="enviarEmoji('😍')">😍</button>
            <button class="emoji-btn" onclick="enviarEmoji('😘')">😘</button>
            <button class="emoji-btn" onclick="enviarEmoji('💞')">💞</button>
            <button class="emoji-btn" onclick="enviarEmoji('💘')">💘</button>
            <button class="emoji-btn" onclick="enviarEmoji('💖')">💖</button>
        </div>

        <!-- NOVO: Mini Chat -->
        <div class="chat-container">
            <div id="messages-area" class="messages">
                <!-- As mensagens aparecerão aqui -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Digite uma mensagem..." onkeypress="verificarEnter(event)">
                <button onclick="enviarMensagem()">➤</button>
            </div>
        </div>

    </div>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        // IMPORTANTE: Adicionei o 'push' aqui embaixo
        import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD15BizvlLZEvZPi4VJDOJ-aI7t1lcNQi4",
            authDomain: "nosso-coracao.firebaseapp.com",
            databaseURL: "https://nosso-coracao-default-rtdb.firebaseio.com",
            projectId: "nosso-coracao",
            storageBucket: "nosso-coracao.firebasestorage.app",
            messagingSenderId: "560106544356",
            appId: "1:560106544356:web:25926da1705d98941da0f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let usuarioAtual = "";
        let parceiro = "";
        let nomeExibicaoParceiro = "";
        let pronomeParceiro = "";
        
        let meuEstado = "idle";
        let estadoParceiro = "idle";

        let tapTimeout = null;
        let lastTap = 0;
        let ultimaVerificacaoEmoji = Date.now(); 

        const dbRefs = {
            kevin: ref(db, 'status/kevin'), 
            maria: ref(db, 'status/maria') 
        };
        const emojiRefs = {
            kevin: ref(db, 'emoji/kevin'),
            maria: ref(db, 'emoji/maria')
        };
        // Referência do Chat
        const chatRef = ref(db, 'chat');

        window.verificarSenha = function() {
            const senhaDigitada = document.getElementById('senha').value;

            if (senhaDigitada === '1509') {
                usuarioAtual = 'kevin';
                parceiro = 'maria';
                nomeExibicaoParceiro = 'A Maria';
                pronomeParceiro = 'ela';
                prepararTela('Kevin', '💙');
            } else if (senhaDigitada === '1507') {
                usuarioAtual = 'maria';
                parceiro = 'kevin';
                nomeExibicaoParceiro = 'O Kevin';
                pronomeParceiro = 'ele';
                prepararTela('Maria', '🔥');
            } else {
                alert('Senha incorreta!');
                document.getElementById('senha').value = '';
            }
        }

        function prepararTela(nomeExibicao, icone) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex'; // Mudou para flex
            document.getElementById('greeting').innerText = `Olá, ${nomeExibicao} ${icone}`;
            
            set(dbRefs[usuarioAtual], 'idle');
            ultimaVerificacaoEmoji = Date.now(); 
            
            iniciarMonitoramento();
        }

        function atualizarTela() {
            const heartBtn = document.getElementById('heart-btn');
            const statusText = document.getElementById('status');

            heartBtn.classList.remove('beating', 'glowing');

            if (meuEstado === 'visto') {
                statusText.innerHTML = `<b>${nomeExibicaoParceiro} sentiu seu coração<br>enviar e está pensando em você! 🥰✨</b>`;
                heartBtn.innerText = "💖";
                heartBtn.classList.add('glowing');
                
                setTimeout(() => {
                    if(meuEstado === 'visto') set(dbRefs[usuarioAtual], 'idle');
                }, 4500);
                return; 
            }

            if (estadoParceiro === 'pensando') {
                statusText.innerHTML = `<b>${nomeExibicaoParceiro} está pensando em você!</b><br><span style="font-size:14px; color:#888;">Toque 2 vezes para avisar que sentiu.</span>`;
                heartBtn.innerText = "❤️";
                heartBtn.classList.add('beating');
                return;
            }

            if (meuEstado === 'pensando') {
                statusText.innerHTML = `Pensamento enviado...<br><span style="font-size:14px; color:#888;">Aguardando ${pronomeParceiro} sentir.</span>`;
                heartBtn.innerText = "❤️";
                return;
            }

            statusText.innerHTML = `Tudo calmo por aqui.<br><span style="font-size:14px; color:#888;">Toque 1x para enviar pensamento, 2x para visualizar.</span>`;
            heartBtn.innerText = "❤️";
        }

        window.enviarEmoji = function(emoji) {
            set(emojiRefs[usuarioAtual], { icon: emoji, time: Date.now() });
            criarAnimacaoEmoji(emoji);
        }

        function criarAnimacaoEmoji(emoji) {
            const el = document.createElement('div');
            el.innerText = emoji;
            el.className = 'floating-emoji';
            
            const randomLeft = 30 + Math.random() * 40; 
            el.style.left = `${randomLeft}%`;
            
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // --- LÓGICA DO CHAT ---
        window.enviarMensagem = function() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            
            if (texto !== "") {
                // Cria uma nova mensagem no banco
                push(chatRef, {
                    sender: usuarioAtual,
                    texto: texto,
                    timestamp: Date.now()
                });
                input.value = ""; // Limpa o campo
            }
        }

        // Permite enviar apertando a tecla Enter no celular/pc
        window.verificarEnter = function(event) {
            if (event.key === "Enter") {
                enviarMensagem();
            }
        }

        function iniciarMonitoramento() {
            const heartBtn = document.getElementById('heart-btn');

            onValue(dbRefs[usuarioAtual], (snapshot) => {
                meuEstado = snapshot.val() || 'idle';
                atualizarTela();
            });

            onValue(dbRefs[parceiro], (snapshot) => {
                estadoParceiro = snapshot.val() || 'idle';
                atualizarTela();
            });

            onValue(emojiRefs[parceiro], (snapshot) => {
                const data = snapshot.val();
                if (data && data.time > ultimaVerificacaoEmoji) {
                    ultimaVerificacaoEmoji = data.time;
                    criarAnimacaoEmoji(data.icon);
                }
            });

            // Carrega e atualiza o Chat em tempo real
            onValue(chatRef, (snapshot) => {
                const messagesArea = document.getElementById('messages-area');
                messagesArea.innerHTML = ""; // Limpa a tela para recarregar as mensagens
                
                snapshot.forEach((childSnapshot) => {
                    const msg = childSnapshot.val();
                    const div = document.createElement('div');
                    
                    // Verifica se fui eu que mandei ou a Maria
                    div.className = 'msg ' + (msg.sender === usuarioAtual ? 'mine' : 'theirs');
                    div.innerText = msg.texto;
                    
                    messagesArea.appendChild(div);
                });
                
                // Rola o chat automaticamente para o final
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });

            // Clique no Coração
            heartBtn.addEventListener('click', function(e) {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                
                if (tapLength < 500 && tapLength > 0) {
                    clearTimeout(tapTimeout);
                    if (estadoParceiro === 'pensando') {
                        set(dbRefs[parceiro], 'visto');
                        heartBtn.innerText = "✨";
                        setTimeout(() => heartBtn.innerText = "❤️", 500);
                    }
                } else {
                    tapTimeout = setTimeout(function() {
                        if (meuEstado !== 'pensando' && meuEstado !== 'visto') {
                            set(dbRefs[usuarioAtual], 'pensando');
                            heartBtn.style.transform = "scale(0.8)";
                            setTimeout(() => heartBtn.style.transform = "scale(1)", 150);
                        }
                    }, 500);
                }
                lastTap = currentTime;
            });
        }
    </script>
</body>
</html>
